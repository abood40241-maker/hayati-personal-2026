11px}.module{background:var(--panel);border:1px solid var(--stroke);color:var(--txt);border-radius:16px;padding:18px 12px;text-align:right;display:flex;align-items:center;gap:11px;min-height:74px}.module:hover,.module:focus{border-color:var(--accent);background:var(--panel2)}.module .emoji{font-size:24px}.nav{position:fixed;bottom:0;right:0;left:0;background:#08172cf5;backdrop-filter:blur(14px);border-top:1px solid var(--stroke);display:flex;justify-content:center;gap:7px;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));z-index:10}.nav button{background:transparent;border:0;color:var(--sub);padding:8px 12px;border-radius:12px;min-width:68px;font-size:12px}.nav button.active{color:#fff;background:#1c4678}.nav .ni{font-size:21px;display:block}button.primary{background:#2787f9;border:1px solid #388fff;color:#fff;border-radius:12px;padding:10px 17px;font-weight:700}button.secondary{background:#1c3250;border:1px solid #385273;color:#fff;border-radius:12px;padding:10px 15px}button.danger{background:#4c2437;border:1px solid #8d465a;color:#fff;border-radius:12px;padding:7px 12px}button.small{font-size:12px;padding:5px 10px}button.ghost{border:none;background:transparent;color:#a5caff;padding:4px 7px}.list{display:grid;gap:9px}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:13px 15px}.entry .detail{flex:1;min-width:0}.entry .detail h3{overflow-wrap:anywhere}.entry small{color:var(--sub)}.entry .actions{display:flex;gap:5px;flex-shrink:0}.money-pos{color:var(--green)}.money-neg{color:#ff9aa7}.bar{height:10px;border-radius:15px;background:#29435e;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#388bff,#49dabd)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:grid;gap:5px;color:#c3d7ee;font-size:13px}input,textarea,select{background:#091a31;color:#f4f8ff;border:1px solid #375172;border-radius:11px;outline:none;padding:11px 12px;width:100%;min-width:0;color-scheme:dark}input:focus,select:focus,textarea:focus{border-color:#5aa8ff}textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.form-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:15px}.empty{text-align:center;color:var(--sub);padding:35px 12px;background:#0d1d35;border:1px dashed var(--stroke);border-radius:16px}.tag{border-radius:99px;color:#a9d0fc;background:#19365d;padding:3px 10px;font-size:12px}.hide{display:none!important}.toast{position:fixed;bottom:95px;right:50%;transform:translateX(50%);z-index:55;color:white;border:1px solid #49709c;background:#213c60;border-radius:12px;padding:10px 18px;max-width:95%;text-align:center;box-shadow:0 8px 40px #0008}.cover{aspect-ratio:1;background:#102643;object-fit:cover;width:100%;border-radius:13px;display:block}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.memory{background:var(--panel);border:1px solid var(--stroke);padding:9px;border-radius:16px}.memory h3{margin-top:7px}.memory .actions{display:flex;gap:6px;margin-top:9px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:17px}.tabs button{padding:7px 12px;background:#142b4b;color:#c0d4f0;border:1px solid var(--stroke);border-radius:10px}.tabs button.active{background:#255d9e;color:white;border-color:#4a8bce}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{text-align:right;border-bottom:1px solid var(--stroke);padding:11px}th{color:#adc6e6}.note{background:#152940;border-right:3px solid #61a7ed;border-radius:7px;padding:12px;color:#c4d7ed;font-size:13px}dialog{width:min(540px,calc(100vw - 28px));max-height:88vh;overflow:auto;background:#10213b;color:white;border:1px solid #3a5d85;border-radius:20px;padding:23px}dialog::backdrop{background:#000a}dialog .close{float:left}.checkline{display:flex;gap:9px;align-items:center}.checkline input{width:20px}.checkline.done{text-decoration:line-through;opacity:.65}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:720px){.app{padding:20px 13px 115px}.cards{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}.media-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.hero b{font-size:27px}.card strong.big{font-size:19px}h1{font-size:22px}.nav button{min-width:58px;padding:7px 6px}}@media(min-width:900px){.app{padding-bottom:115px}}

</head><body><div class="app"><header><div class="top"><div class="logo">✦</div><div class="brand"><h1>حياتي</h1><small>مساحتك الشخصية · الإصدار 3 · بدون اشتراك</small></div></div><span class="pill" id="today"></span></header><main id="app"></main></div><nav class="nav" id="nav"></nav><dialog id="modal"><button class="ghost close" onclick="modal.close()">✕ إغلاق</button><div id="modalBody" style="clear:both;padding-top:12px"></div></dialog><div class="toast hide" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}), cash=n=>fmt(n)+' ر.س', dnow=()=>localDate(new Date()), localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2), esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])), datefmt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('ar-SA-u-nu-latn',{year:'numeric',month:'short',day:'numeric'}):'—';
const modules=[['dashboard','🏠','الرئيسية'],['journal','📖','سجل حياتي'],['objectives','🎯','أهداف حياتي'],['finance','💳','المالية'],['goals','💰','الادخار والاستثمار'],['future','💍','الزواج والمستقبل'],['study','🎓','الجامعة'],['health','💙','الصحة والعادات'],['car','🚘','سيارتي'],['relationships','🤍','العلاقات'],['memories','📷','ذكرياتي'],['tasks','🗓️','المهام والتقويم'],['settings','⚙️','الإعدادات']];
let state={records:[],tasks:[],habits:[],memories:[],journal:[],objectives:[],settings:{monthlySave:2000,weeklyLimit:240,weddingBudget:100000,weddingYear:2031,openingSpend:0,openingSavings:0,openingInvest:0}},tab='dashboard',filter='all',db;
const DB_NAME='hayati-v1';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{let b=r.result;b.createObjectStore('data');b.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbRead(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbWrite(store,key,value){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function dbAllFiles(){return new Promise((res,rej)=>{const r=db.transaction('files','readonly').objectStore('files').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let saving=Promise.resolve();function save(){saving=saving.then(()=>dbWrite('data','state',state)).catch(e=>toast('تعذر الحفظ: '+e.message));return saving}
function toast(message){let t=$('#toast');t.textContent=message;t.classList.remove('hide');clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.add('hide'),3800)}
function go(id){tab=id;filter='all';render();scrollTo({top:0,behavior:'smooth'})}
function nav(){let ids=['dashboard','journal','objectives','memories','settings'];$('#nav').innerHTML=ids.map(id=>{let m=modules.find(z=>z[0]===id);return `<button class="${tab===id?'active':''}" data-go="${id}"><span class="ni">${m[1]}</span>${m[2]}</button>`}).join('')}
function head(name,sub,cta=''){return `<div class="section-head"><div><h2>${name}</h2>${sub?`<p class="muted">${sub}</p>`:''}</div>${cta}</div>`}
function card(title,num,sub=''){return `<div class="card"><div class="muted">${title}</div><strong class="big">${num}</strong><div class="muted">${sub}</div></div>`}
function recordTotals(){let val={spend:state.settings.openingSpend||0,savings:state.settings.openingSavings||0,invest:state.settings.openingInvest||0,income:0,expense:0};for(let r of state.records){if(r.type==='income'){val.spend+=r.amount;val.income+=r.amount}else if(r.type==='expense'){val.spend-=r.amount;val.expense+=r.amount}else if(r.type==='save'){val.spend-=r.amount;val.savings+=r.amount}else if(r.type==='unsave'){val.spend+=r.amount;val.savings-=r.amount}else if(r.type==='invest'){val.spend-=r.amount;val.invest+=r.amount}else if(r.type==='uninvest'){val.spend+=r.amount;val.invest-=r.amount}else if(r.type==='profit'){val.invest+=r.amount}}return val}
function weekly(){let n=new Date(),day=(n.getDay()+6)%7,start=new Date(n.getFullYear(),n.getMonth(),n.getDate()-day),end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6),a=localDate(start),b=localDate(end);let used=state.records.filter(r=>r.type==='expense'&&r.date>=a&&r.date<=b).reduce((s,r)=>s+r.amount,0);return {used,left:(state.settings.weeklyLimit||0)-used,a,b}}
function dailyAdvice(){let t=recordTotals(),w=weekly(),today=dnow(),due=state.tasks.filter(x=>!x.done&&x.date&&x.date<=today).sort((a,b)=>a.date.localeCompare(b.date)),upcoming=state.tasks.filter(x=>!x.done&&x.date&&x.date>today).sort((a,b)=>a.date.localeCompare(b.date)),goals=state.objectives.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),notes=[];
if(due.length)notes.push({icon:'📌',title:'مهام تحتاج اهتمامك',body:`لديك ${due.length} مهمة مستحقة أو متأخرة. ابدأ بـ «${due[0].title}».`,target:'tasks'});
if(w.left<0)notes.push({icon:'⚠️',title:'الميزانية تجاوزت الحد',body:`تجاوزت ميزانيتك الأسبوعية بمقدار ${cash(-w.left)}. راجع المصاريف غير الضرورية.`,target:'finance'});
else if(state.settings.weeklyLimit>0&&w.left<state.settings.weeklyLimit*.25)notes.push({icon:'💳',title:'الميزانية تقترب من الحد',body:`بقي ${cash(w.left)} لهذا الأسبوع.`,target:'finance'});
if(goals.length)notes.push({icon:'🎯',title:'خطوة نحو هدفك',body:`تابع «${goals[0].title}» وحدّث تقدّمك عند إنجاز خطوة حقيقية.`,target:'objectives'});
if(upcoming.length)notes.push({icon:'🗓️',title:'الاستعداد للمواعيد',body:`مهمتك القادمة «${upcoming[0].title}» بتاريخ ${datefmt(upcoming[0].date)}.`,target:'tasks'});
if(!state.journal.some(x=>x.date===today))notes.push({icon:'📖',title:'وثّق يومك',body:'سجل حدثًا واحدًا أو فكرة من يومك ليسهل إعداد تقريرك لاحقًا.',target:'journal'});
return `<section class="section">${head('مساعد يومي بدون اشتراك','اقتراحات قائمة على البيانات المسجلة على جهازك، وليست ذكاءً اصطناعيًا متصلًا بالإنترنت')}<div class="list">${notes.slice(0,4).map(n=>`<div class="entry"><div class="detail"><h3>${n.icon} ${esc(n.title)}</h3><p class="muted">${esc(n.body)}</p></div><button class="secondary small" data-go="${n.target}">فتح</button></div>`).join('')||'<div class="empty">لا توجد تنبيهات. يمكنك إضافة أهداف أو مهام أو أحداث يومية.</div>'}</div></section>`}
function dashboard(){let t=recordTotals(),w=weekly(),todo=state.tasks.filter(x=>!x.done).length;return `<section class="hero"><span class="muted">نظرة على حياتك اليوم</span><b>كل شيء في مكان واحد ✦</b><div class="muted">سجّل يومك، احفظ ذكرياتك، وخطّط لمستقبلك بثقة.</div></section><div class="cards">${card('المصروف المتاح',cash(t.spend),'الرصيد الشخصي')}${card('مدخراتي',cash(t.savings),'منفصلة عن الاستثمار')}${card('الاستثمار',cash(t.invest),'العائد ليس مضمونًا')}${card('المتبقي من حد الأسبوع',cash(w.left),'من أصل '+cash(state.settings.weeklyLimit))}${card('المهام المفتوحة',todo,'مهمة بانتظارك')}${card('عدد الذكريات',state.memories.length,'صور ومقاطع وذكريات')}</div>${dailyAdvice()}<section class="section"><div class="row"><button class="primary" data-go="journal">📖 سجل يومك</button><button class="secondary" data-go="objectives">🎯 خطط لأهدافك</button></div></section><section class="section">${head('أقسام حياتي','اختر القسم لإدارة تفاصيله')}<div class="modules">${modules.filter(m=>m[0]!=='dashboard').map(m=>`<button class="module" data-go="${m[0]}"><span class="emoji">${m[1]}</span><b>${m[2]}</b></button>`).join('')}</div></section><div class="note">خصوصيتك أولًا: لا تضع نسخة احتياطية غير مشفرة في مكان مشترك. بياناتك في هذا الإصدار محفوظة محليًا في متصفح هذا الجهاز، وقد تضيع عند مسح بياناته.</div>`}
const typenames={income:'دخل',expense:'مصروف',save:'تحويل إلى الادخار',unsave:'سحب من الادخار',invest:'تحويل إلى الاستثمار',uninvest:'سحب من الاستثمار',profit:'أرباح استثمار'};
function recordList(arr){if(!arr.length)return `<div class="empty">لا توجد عمليات حتى الآن. أضف أول عملية من الزر أعلاه.</div>`;return `<div class="list">${arr.map(r=>`<div class="entry"><div class="detail"><h3>${esc(r.title||typenames[r.type])}</h3><small>${esc(typenames[r.type])} · ${datefmt(r.date)} ${r.category?'· '+esc(r.category):''}</small></div><b class="${['income','profit','unsave','uninvest'].includes(r.type)?'money-pos':'money-neg'}">${cash(r.amount)}</b><div class="actions"><button class="ghost" data-editrecord="${r.id}">تعديل</button><button class="danger small" data-delete="records:${r.id}">حذف</button></div></div>`).join('')}</div>`}
function finance(){let t=recordTotals(),w=weekly(),items=state.records.filter(r=>filter==='all'||r.type===filter).sort((a,b)=>b.date.localeCompare(a.date));return `${head('المالية','دخل، مصاريف، هدايا، وحركات مالية فعلية','<button class="primary" data-action="record">+ إضافة عملية</button>')}<div class="cards">${card('رصيدي الشخصي',cash(t.spend))}${card('إجمالي الدخل المسجل',cash(t.income))}${card('إجمالي المصاريف المسجلة',cash(t.expense))}</div><section class="section"><div class="card"><div class="section-head"><h3>الميزانية الأسبوعية</h3><span class="tag">${w.a} إلى ${w.b}</span></div><div class="row"><strong class="big">${cash(w.left)} متبقية</strong><span class="muted">صرفت ${cash(w.used)} من ${cash(state.settings.weeklyLimit)}</span></div><div class="bar"><i style="width:${Math.min(100,state.settings.weeklyLimit?100*w.used/state.settings.weeklyLimit:0)}%"></i></div></div></section><section class="section">${head('سجل الحركات','تحديث مباشر لجميع الأرصدة')}<div class="tabs">${[['all','الكل'],...Object.entries(typenames)].map(([id,n])=>`<button class="${filter===id?'active':''}" data-filter="${id}">${n}</button>`).join('')}</div>${recordList(items)}</section>`}
function goalSection(){let t=recordTotals(),years=10,save=Number(state.settings.monthlySave||0);return `${head('الادخار والاستثمار','محفظتان منفصلتان تمامًا','<button class="primary" data-action="record">+ إضافة حركة</button>')}<div class="cards">${card('مدخراتي الحالية',cash(t.savings))}${card('رصيد الاستثمار',cash(t.invest))}${card('ادخار شهري مستهدف',cash(save))}</div><section class="section"><div class="card"><h3>خطة الادخار بدون احتساب أرباح</h3><p class="muted">نمو خطي افتراضي إذا التزمت بادخار المبلغ نفسه كل شهر. لا توجد أرباح مضمونة.</p><div class="table-wrap"><table><thead><tr><th>بعد</th><th>الادخار المتوقع</th><th>الإجمالي الشخصي + الادخار</th></tr></thead><tbody>${[1,2,3,5,10].map(y=>`<tr><td>${y} سنة</td><td>${cash(t.savings+12*y*save)}</td><td>${cash(t.savings+t.spend+12*y*save)}</td></tr>`).join('')}</tbody></table></div></div></section><div class="note">أرباح الاستثمار تُسجَّل كعملية مستقلة عند تحققها فعليًا، ولا تُكرر تلقائيًا.</div>`}
function future(){let t=recordTotals(),s=state.settings,year=Number(s.weddingYear||2031),months=Math.max(0,(year-new Date().getFullYear())*12+(12-new Date().getMonth()-1));let projected=t.savings+months*Number(s.monthlySave||0);return `${head('الزواج والمستقبل','خطط بخيارات واقعية، وعدّل ميزانيتك من الإعدادات')}<div class="cards">${card('سنة الزواج المستهدفة',year)}${card('تكلفة الزواج المخططة',cash(s.weddingBudget))}${card('الادخار المتوقع قبل الموعد',cash(projected))}</div><section class="section"><div class="card"><h3>تقدير الفجوة المالية</h3><strong class="big" style="color:${projected>=s.weddingBudget?'var(--green)':'var(--gold)'}">${cash(projected-s.weddingBudget)}</strong><p class="muted">الفرق بين مدخراتك المتوقعة وتكلفة الزواج، دون احتساب رأس مال الاستثمار أو أرباحه. الحساب تقريبي ويعتمد على نهاية سنة الزواج.</p></div></section><section class="section"><div class="card"><h3>خطة عشر سنوات</h3><div class="table-wrap"><table><thead><tr><th>السنة</th><th>مدخراتي المتوقعة</th><th>بعد تكلفة الزواج (إن حدث)</th></tr></thead><tbody>${Array.from({length:10},(_,i)=>{let y=new Date().getFullYear()+i+1;let amount=t.savings+12*(i+1)*s.monthlySave;return `<tr><td>${y}</td><td>${cash(amount)}</td><td>${cash(amount-(y>=year?s.weddingBudget:0))}</td></tr>`}).join('')}</tbody></table></div></div></section><div class="note">هذه محاكاة ادخار وليست ميزانية معيشة بعد الزواج. عدّل المبلغ الشهري لاحقًا إذا تغير دخلك أو مصاريفك.</div>`}
const categoryConfigs={study:{title:'الجامعة',desc:'المواد، الاختبارات، والواجبات',kinds:['مذاكرة','اختبار','واجب','محاضرة'],icon:'🎓'},health:{title:'الصحة والعادات',desc:'الرياضة، النوم، والإقلاع عن النيكوتين',kinds:['رياضة','نوم','إقلاع','صحة'],icon:'💙'},car:{title:'سيارتي',desc:'الصيانة، البنزين، التأمين والمواعيد',kinds:['بنزين','صيانة','تأمين','غسيل','أخرى'],icon:'🚘'},relationships:{title:'العلاقات',desc:'المناسبات، الأشخاص واللحظات المهمة',kinds:['مناسبة','تواصل','ذكرى','هدية'],icon:'🤍'},tasks:{title:'مهامي والتقويم',desc:'جميع المهام والمواعيد في مكان واحد',kinds:['مهمة','موعد','هدف','تذكير'],icon:'🗓️'}};
function tasksPage(area){let c=categoryConfigs[area],items=state.tasks.filter(x=>area==='tasks'||x.area===area).sort((a,b)=>(a.done-b.done)||(a.date||'').localeCompare(b.date||''));return `${head(c.icon+' '+c.title,c.desc,`<button class="primary" data-addtask="${area}">+ إضافة</button>`)}<div class="list">${items.length?items.map(x=>`<div class="entry"><div class="detail"><div class="checkline ${x.done?'done':''}"><input aria-label="إنجاز المهمة" type="checkbox" data-toggle="${x.id}" ${x.done?'checked':''}/><h3>${esc(x.title)}</h3></div><small>${esc(x.kind)} ${x.date?'· '+datefmt(x.date):''} ${x.area&&area==='tasks'?'· '+esc(categoryConfigs[x.area]?.title||''):''}</small>${x.notes?`<p class="muted">${esc(x.notes)}</p>`:''}</div><div class="actions"><button class="ghost" data-edittask="${x.id}">تعديل</button><button class="danger small" data-delete="tasks:${x.id}">حذف</button></div></div>`).join(''):`<div class="empty">لا توجد عناصر في ${c.title}، أضف أول عنصر الآن.</div>`}</div>`}
function memories(){let x=state.memories.filter(x=>filter==='all'||x.album===filter).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),albums=[...new Set(state.memories.map(x=>x.album||'بدون ألبوم'))];return `${head('📷 ذكرياتي','ألبومات خاصة بصورك وفيديوهاتك','<button class="primary" data-action="memory">+ ذكرى جديدة</button>')}<div class="note">المرفقات تُخزن على جهازك داخل بيانات المتصفح (IndexedDB). لا تحذف بيانات الموقع قبل تصدير نسخة احتياطية. لا يوجد رفع سحابي أو مزامنة.</div><section class="section"><div class="tabs"><button class="${filter==='all'?'active':''}" data-filter="all">جميع الذكريات</button>${albums.map(a=>`<button class="${filter===a?'active':''}" data-filter="${esc(a)}">${esc(a)}</button>`).join('')}</div><div class="media-grid">${x.length?x.map(m=>`<div class="memory"><div data-preview="${m.id}" style="cursor:pointer"><div id="thumb-${m.id}" class="cover" style="display:grid;place-items:center;font-size:40px">${m.fileIds?.length?'📷':'📝'}</div><h3>${esc(m.title)}</h3><small class="muted">${datefmt(m.date)} · ${esc(m.album||'بدون ألبوم')}</small></div><div class="actions"><button class="secondary small" data-preview="${m.id}">عرض</button><button class="ghost" data-editmemory="${m.id}">تعديل</button><button class="danger small" data-delete="memories:${m.id}">حذف</button></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">ذكرياتك تبدأ من هنا. أضف صورك أو فيديوهاتك المفضلة ✨</div>'}</div></section>`}
function settings(){let s=state.settings;return `${head('الإعدادات والخصوصية','تحكم ببياناتك ونسخك الاحتياطية')}<div class="card"><h3>إعدادات مالية</h3><form id="settingsForm" class="form-grid" style="margin-top:14px"><label>الرصيد الشخصي الافتتاحي (ر.س)<input name="openingSpend" type="number" step=".01" value="${s.openingSpend||0}" required></label><label>مدخرات افتتاحية (ر.س)<input name="openingSavings" type="number" step=".01" value="${s.openingSavings||0}" required></label><label>رصيد استثماري افتتاحي (ر.س)<input name="openingInvest" type="number" step=".01" value="${s.openingInvest||0}" required></label><label>حد الصرف الأسبوعي (ر.س)<input name="weeklyLimit" type="number" step=".01" value="${s.weeklyLimit||0}" required></label><label>ادخار شهري مستهدف (ر.س)<input name="monthlySave" type="number" step=".01" value="${s.monthlySave||0}" required></label><label>ميزانية الزواج (ر.س)<input name="weddingBudget" type="number" step=".01" value="${s.weddingBudget||0}" required></label><label>سنة الزواج المستهدفة<input name="weddingYear" type="number" min="2026" max="2100" value="${s.weddingYear||2031}" required></label><div class="full"><button class="primary">حفظ الإعدادات</button></div></form></div><section class="section"><div class="card"><h3>النسخ الاحتياطية</h3><p class="muted">تصدير ملف JSON يحتوي على سجلاتك وذكرياتك ومرفقاتها. تعامل معه كملف خاص: أي شخص يحصل عليه يستطيع قراءة محتواه.</p><div class="row" style="margin-top:14px"><button class="primary" id="export">⬇ تصدير نسخة كاملة</button><label style="display:inline-flex" class="secondary">⬆ استيراد نسخة<input id="importFile" type="file" accept="application/json,.json" style="display:none"></label></div><p class="muted">استيراد النسخة يستبدل بيانات التطبيق الحالية بعد تأكيدك. قد يكون ملف النسخة كبيرًا عند حفظ الفيديوهات.</p></div></section><section class="section"><div class="card"><h3>حدود الحفظ المحلي</h3><p class="muted">لا توجد رسوم اشتراك داخل هذه النسخة. لا توجد مزامنة سحابية أو كلمة مرور داخل التطبيق، وبالتالي من يستطيع فتح المتصفح على جهازك قد يستطيع فتح بيانات التطبيق. استخدم قفل جهازك واحتفظ بنسخ احتياطية منتظمة. في الآيفون قد يحذف النظام بيانات مواقع غير مستخدمة أو عند نقص المساحة.</p><p class="muted">لتثبيته كتطبيق على الشاشة الرئيسية، يلزم فتحه من عنوان HTTPS بعد استضافته على خدمة مجانية مناسبة.</p></div></section>`}
function render(){nav();$('#today').textContent=new Date().toLocaleDateString('ar-SA-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});$('#app').innerHTML=tab==='dashboard'?dashboard():tab==='journal'?journalPage():tab==='objectives'?objectivesPage():tab==='finance'?finance():tab==='goals'?goalSection():tab==='future'?future():tab==='memories'?memories():tab==='settings'?settings():tasksPage(tab);if(tab==='memories')renderThumbnails();}
function showModal(title,inner){$('#modalBody').innerHTML=`<h2>${title}</h2>${inner}`;$('#modal').showModal()}
function recordModal(id){let r=state.records.find(x=>x.id===id)||{type:'expense',date:dnow(),amount:'',title:'',category:''};showModal(id?'تعديل عملية':'إضافة عملية مالية',`<form id="recordForm" class="form-grid"><label>نوع العملية<select name="type">${Object.entries(typenames).map(([k,v])=>`<option value="${k}" ${r.type===k?'selected':''}>${v}</option>`).join('')}</select></label><label>المبلغ (ريال)<input name="amount" type="number" min="0.01" step="0.01" value="${r.amount}" required></label><label>تاريخ العملية<input name="date" type="date" value="${r.date}" required></label><label>التصنيف<input name="category" maxlength="100" value="${esc(r.category)}" placeholder="قهوة، هدية، بنزين..."></label><label class="full">البيان<input name="title" maxlength="180" value="${esc(r.title)}" placeholder="وصف مختصر"></label><div class="full form-actions"><button class="primary">حفظ العملية</button></div></form>`);$('#recordForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),item={id:id||uid(),type:f.get('type'),amount:Number(f.get('amount')),date:String(f.get('date')),category:String(f.get('category')||''),title:String(f.get('title')||'')};if(!(item.amount>0)){toast('اكتب مبلغًا أكبر من صفر');return}if(id)state.records=state.records.map(x=>x.id===id?item:x);else state.records.push(item);save();$('#modal').close();render();toast('تم حفظ العملية محليًا')}}
function taskModal(area,id){let r=state.tasks.find(x=>x.id===id)||{area,kind:categoryConfigs[area].kinds[0],title:'',date:dnow(),notes:'',done:false};showModal(id?'تعديل عنصر':'إضافة إلى '+categoryConfigs[area].title,`<form id="taskForm" class="form-grid"><label class="full">العنوان<input name="title" value="${esc(r.title)}" maxlength="180" required></label><label>القسم<select name="area">${Object.entries(categoryConfigs).filter(([k])=>k!=='tasks').concat([['tasks',categoryConfigs.tasks]]).map(([k,v])=>`<option value="${k}" ${r.area===k?'selected':''}>${v.title}</option>`).join('')}</select></label><label>النوع<input name="kind" value="${esc(r.kind)}" maxlength="50" placeholder="مهمة / اختبار / موعد" required></label><label>التاريخ<input name="date" type="date" value="${r.date||dnow()}"></label><label class="full">تفاصيل إضافية<textarea name="notes">${esc(r.notes)}</textarea></label><div class="full form-actions"><button class="primary">حفظ</button></div></form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:id||uid(),title:String(f.get('title')),area:String(f.get('area')),kind:String(f.get('kind')),date:String(f.get('date')),notes:String(f.get('notes')),done:r.done};if(id)state.tasks=state.tasks.map(z=>z.id===id?x:z);else state.tasks.push(x);save();$('#modal').close();render();toast('تم حفظ العنصر')}}
function memoryModal(id){let r=state.memories.find(m=>m.id===id)||{title:'',date:dnow(),album:'',notes:'',fileIds:[]};showModal(id?'تعديل الذكرى':'إضافة ذكرى جديدة',`<form id="memoryForm" class="form-grid"><label class="full">عنوان الذكرى<input name="title" maxlength="160" value="${esc(r.title)}" required></label><label>التاريخ<input name="date" type="date" value="${r.date||dnow()}" required></label><label>الألبوم<input name="album" maxlength="80" value="${esc(r.album)}" placeholder="سفر، عائلة، جامعة..."></label><label class="full">وصف الذكرى<textarea name="notes">${esc(r.notes)}</textarea></label><label class="full">إضافة صور وفيديوهات (20 ملفًا كحد أقصى لكل مرة، 40MB لكل ملف)<input id="memoryFiles" type="file" accept="image/*,video/*" multiple></label><div class="full note">المرفقات السابقة محفوظة عند التعديل. للتخلص من ملف معين، احذف الذكرى كاملة ثم أنشئها مجددًا.</div><div class="full form-actions"><button class="primary" id="saveMemory">حفظ الذكرى</button></div></form>`);$('#memoryForm').onsubmit=async e=>{e.preventDefault();let btn=$('#saveMemory');btn.disabled=true;let f=new FormData(e.target),files=[...$('#memoryFiles').files],max=40*1024*1024;if(files.length>20||files.some(z=>z.size>max)||files.some(z=>!/^image\/|^video\//.test(z.type))){toast('الحد: 20 ملفًا، 40MB لكل ملف، صور أو فيديو فقط');btn.disabled=false;return}let stored=[];try{for(let file of files){let key=uid();await dbWrite('files',key,{blob:file,name:file.name,type:file.type});stored.push(key)}let m={id:id||uid(),title:String(f.get('title')),date:String(f.get('date')),album:String(f.get('album')||'بدون ألبوم'),notes:String(f.get('notes')||''),fileIds:[...(r.fileIds||[]),...stored]};if(id)state.memories=state.memories.map(z=>z.id===id?m:z);else state.memories.push(m);await save();$('#modal').close();render();toast('تم حفظ الذكرى محليًا')}catch(error){for(let x of stored)await dbDelete('files',x);toast('تعذر حفظ الملفات. قد تكون مساحة الجهاز غير كافية: '+error.message)}finally{btn.disabled=false}}}
let objectUrls=[];function clearUrls(){objectUrls.forEach(x=>URL.revokeObjectURL(x));objectUrls=[]}async function renderThumbnails(){clearUrls();for(let m of state.memories){let el=document.getElementById('thumb-'+m.id);if(!el||!m.fileIds?.length)continue;let file=await dbRead('files',m.fileIds[0]);if(!el.isConnected||!file)continue;let url=URL.createObjectURL(file.blob);objectUrls.push(url);if(file.type.startsWith('image/')){let im=document.createElement('img');im.src=url;im.className='cover';im.alt='صورة الذكرى';el.replaceWith(im)}else{el.textContent='🎥'}}}
async function preview(id){let m=state.memories.find(x=>x.id===id);if(!m)return;showModal(esc(m.title),`<div class="muted">${datefmt(m.date)} · ${esc(m.album)}</div><p>${esc(m.notes)}</p><div id="mediaPreview" class="list"></div>`);let target=$('#mediaPreview');for(let key of m.fileIds||[]){let x=await dbRead('files',key);if(!x)continue;let url=URL.createObjectURL(x.blob);objectUrls.push(url);let wrapper=document.createElement('div');wrapper.className='card';let media=x.type.startsWith('video/')?document.createElement('video'):document.createElement('img');media.src=url;media.style='width:100%;border-radius:12px;max-height:400px;object-fit:contain';if(media.tagName==='VIDEO')media.controls=true;wrapper.append(media);let a=document.createElement('a');a.href=url;a.download=x.name||'memory';a.textContent='⬇ حفظ الملف الأصلي';a.style='color:#8ac4ff';wrapper.append(a);target.append(wrapper)}}
async function deletion(kind,id){if(!confirm('هل تريد الحذف نهائيًا؟'))return;if(kind==='journal')state.journal=state.journal.filter(x=>x.id!==id);if(kind==='objectives')state.objectives=state.objectives.filter(x=>x.id!==id);if(kind==='records')state.records=state.records.filter(x=>x.id!==id);if(kind==='tasks')state.tasks=state.tasks.filter(x=>x.id!==id);if(kind==='memories'){let m=state.memories.find(x=>x.id===id);state.memories=state.memories.filter(x=>x.id!==id);for(let key of m?.fileIds||[])await dbDelete('files',key)}await save();render();toast('تم الحذف')}
function bytesToBase64(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function base64ToBlob(data,type){let raw=atob(data),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return new Blob([arr],{type:type||'application/octet-stream'})}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function exportAll(){let btn=$('#export');btn.disabled=true;try{await saving;let keys=await dbAllFiles(),files={};for(let key of keys){let x=await dbRead('files',key);files[key]={name:x.name,type:x.type,base64:await bytesToBase64(x.blob)}}let out={format:'hayati-backup',version:1,createdAt:new Date().toISOString(),state,files};downloadBlob(new Blob([JSON.stringify(out)],{type:'application/json'}),'hayati-backup-'+dnow()+'.json');toast('تم تجهيز النسخة الاحتياطية. تأكد من حفظ الملف في مكان آمن.')}catch(e){toast('تعذر التصدير: '+e.message)}finally{btn.disabled=false}}
async function importAll(file){if(!file)return;if(!confirm('استيراد النسخة سيستبدل جميع البيانات والذكريات الحالية. هل تريد المتابعة؟'))return;try{let raw=JSON.parse(await file.text());if(raw.format!=='hayati-backup'||raw.version!==1||!raw.state||!Array.isArray(raw.state.records)||!Array.isArray(raw.state.tasks)||!Array.isArray(raw.state.memories)||!raw.files)throw Error('صيغة النسخة الاحتياطية غير صحيحة');let snapshot={state:structuredClone(state)};let previous=await dbAllFiles();snapshot.files={};for(let k of previous)snapshot.files[k]=await dbRead('files',k);try{for(let k of previous)await dbDelete('files',k);for(let [key,val]of Object.entries(raw.files)){if(!val?.base64)throw Error('مرفق غير صالح');await dbWrite('files',key,{blob:base64ToBlob(val.base64,val.type),name:val.name,type:val.type})}state=raw.state;await save()}catch(e){for(let k of await dbAllFiles())await dbDelete('files',k);for(let [key,val] of Object.entries(snapshot.files))await dbWrite('files',key,val);state=snapshot.state;await save();throw e}render();toast('تم استيراد النسخة')}catch(e){toast('فشل الاستيراد: '+e.message)}}

const journalTypes=['يوميات','إنجاز','دراسة','مشوار','ملاحظة','صحة','قرار','حدث مهم'];
function journalPage(){let today=dnow(),events=[...state.journal].sort((a,b)=>b.date.localeCompare(a.date)),todays=events.filter(x=>x.date===today),finished=state.tasks.filter(x=>x.done&&x.date===today).length,expenses=state.records.filter(x=>x.type==='expense'&&x.date===today).reduce((a,x)=>a+x.amount,0);return `${head('📖 سجل حياتي','كل يوم قصة، احفظ تفاصيله وتابع تقدمك','<button class="primary" data-action="journal">+ سجل حدثًا</button>')}<div class="cards">${card('أحداث اليوم',todays.length)}${card('مهام اليوم المنجزة',finished)}${card('مصاريف اليوم',cash(expenses))}</div><section class="section"><div class="card"><h3>تقرير اليوم · ${datefmt(today)}</h3><p class="muted">${todays.length?'وثّقت '+todays.length+' حدثًا اليوم.':'لم تسجل أحداثًا اليوم بعد.'}</p><p>المهام المكتملة: ${finished} | مصاريف اليوم: ${cash(expenses)}</p><div class="row"><button class="secondary" data-action="journal">أضف ما حدث</button><button class="secondary" data-go="tasks">المهام اليومية</button></div></div></section><section class="section">${head('الخط الزمني','يمكنك إضافة أحداث سابقة وتعديلها')}<div class="list">${events.length?events.map(x=>`<div class="entry"><div class="detail"><small>${datefmt(x.date)} · ${esc(x.type)}</small><h3>${esc(x.title)}</h3>${x.notes?`<p class="muted">${esc(x.notes)}</p>`:''}${x.mood?`<span class="tag">المزاج: ${esc(x.mood)}</span>`:''}</div><div class="actions"><button class="ghost" data-editjournal="${x.id}">تعديل</button><button class="danger small" data-delete="journal:${x.id}">حذف</button></div></div>`).join(''):'<div class="empty">ابدأ بتسجيل أول حدث من حياتك.</div>'}</div></section>`}
function journalModal(id){let x=state.journal.find(x=>x.id===id)||{date:dnow(),type:'يوميات',title:'',notes:'',mood:''};showModal(id?'تعديل الحدث':'حدث جديد في حياتي',`<form id="journalForm" class="form-grid"><label>تاريخ الحدث<input name="date" type="date" value="${x.date}" required></label><label>نوع الحدث<select name="type">${journalTypes.map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">عنوان الحدث<input name="title" maxlength="180" value="${esc(x.title)}" required></label><label>مزاجك<select name="mood">${['','ممتاز','جيد','عادي','متعب','متوتر'].map(v=>`<option ${x.mood===v?'selected':''}>${v||'غير محدد'}</option>`).join('')}</select></label><label class="full">التفاصيل<textarea name="notes">${esc(x.notes)}</textarea></label><div class="full"><button class="primary">حفظ في سجل حياتي</button></div></form>`);$('#journalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:id||uid(),date:String(f.get('date')),type:String(f.get('type')),title:String(f.get('title')).trim(),mood:String(f.get('mood')),notes:String(f.get('notes'))};if(!v.title)return;if(id)state.journal=state.journal.map(z=>z.id===id?v:z);else state.journal.push(v);save();$('#modal').close();render();toast('تم حفظ الحدث محليًا')}}
const areas=['مالي','دراسي','مهني','صحي','علاقات','مستقبل','شخصي'];
function objectivesPage(){let objectives=[...state.objectives].sort((a,b)=>(a.done-b.done)),completed=objectives.filter(x=>x.done).length;return `${head('🎯 أهداف حياتي','حول طموحاتك إلى خطوات عملية قابلة للقياس','<button class="primary" data-action="objective">+ هدف جديد</button>')}<div class="cards">${card('إجمالي الأهداف',objectives.length)}${card('المكتمل',completed)}${card('قيد العمل',objectives.length-completed)}</div><div class="note">اختر رقمًا مستهدفًا، ثم حدث تقدمك عند تحقيق خطوات فعلية. لا يتم اختراع نسب إنجاز أو أرباح تلقائيًا.</div><section class="section"><div class="list">${objectives.length?objectives.map(g=>{let pct=g.target>0?Math.max(0,Math.min(100,g.current/g.target*100)):0;return `<div class="card"><div class="section-head"><div><small class="muted">${esc(g.area)} · ${g.due?datefmt(g.due):'بدون موعد'}</small><h3>${esc(g.title)}</h3></div><span class="tag">${g.done?'مكتمل':Math.round(pct)+'%'}</span></div><div class="bar"><i style="width:${g.done?100:pct}%"></i></div><p class="muted">التقدم: ${fmt(g.current)} من ${fmt(g.target)} ${esc(g.unit||'وحدة')}</p>${g.notes?`<p>${esc(g.notes)}</p>`:''}<div class="row"><button class="secondary small" data-editobjective="${g.id}">تحديث التقدم</button><button class="secondary small" data-completeobjective="${g.id}">${g.done?'إعادة فتح':'إنهاء الهدف'}</button><button class="danger small" data-delete="objectives:${g.id}">حذف</button></div></div>`}).join(''):'<div class="empty">مثلًا: إنهاء مادة جامعية، الادخار للزواج، تعلم أساسيات الشبكات، أو الالتزام برياضة أسبوعية.</div>'}</div></section>`}
function objectiveModal(id){let x=state.objectives.find(x=>x.id===id)||{title:'',area:'شخصي',due:'',target:100,current:0,unit:'%',notes:'',done:false};showModal(id?'تحديث الهدف':'إضافة هدف لحياتي',`<form id="objectiveForm" class="form-grid"><label class="full">الهدف<input name="title" required maxlength="160" value="${esc(x.title)}" placeholder="مثال: ادخار 20 ألف ريال"></label><label>المجال<select name="area">${areas.map(v=>`<option ${x.area===v?'selected':''}>${v}</option>`).join('')}</select></label><label>تاريخ الاستحقاق<input type="date" name="due" value="${x.due||''}"></label><label>الرقم المستهدف<input name="target" type="number" min="0.01" step="any" required value="${x.target}"></label><label>التقدم الحالي<input name="current" type="number" min="0" step="any" required value="${x.current}"></label><label class="full">وحدة القياس<input name="unit" maxlength="30" value="${esc(x.unit)}" placeholder="ريال / درس / ساعة"></label><label class="full">خطوات أو ملاحظات<textarea name="notes">${esc(x.notes)}</textarea></label><div class="full"><button class="primary">حفظ الهدف</button></div></form>`);$('#objectiveForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:id||uid(),title:String(f.get('title')).trim(),area:String(f.get('area')),due:String(f.get('due')),target:Number(f.get('target')),current:Number(f.get('current')),unit:String(f.get('unit')),notes:String(f.get('notes')),done:x.done};if(!v.title||!Number.isFinite(v.target)||v.target<=0||!Number.isFinite(v.current)||v.current<0){toast('تحقق من القيم');return}if(id)state.objectives=state.objectives.map(z=>z.id===id?v:z);else state.objectives.push(v);save();$('#modal').close();render();toast('تم حفظ الهدف')}}

document.addEventListener('click',async e=>{let a=e.target.closest('[data-go]');if(a){go(a.dataset.go);return}a=e.target.closest('[data-editjournal]');if(a){journalModal(a.dataset.editjournal);return}a=e.target.closest('[data-editobjective]');if(a){objectiveModal(a.dataset.editobjective);return}a=e.target.closest('[data-completeobjective]');if(a){let g=state.objectives.find(x=>x.id===a.dataset.completeobjective);if(g){g.done=!g.done;await save();render()}return}a=e.target.closest('[data-filter]');if(a){filter=a.dataset.filter;render();return}a=e.target.closest('[data-action]');if(a){a.dataset.action==='record'?recordModal():a.dataset.action==='memory'?memoryModal():a.dataset.action==='journal'?journalModal():objectiveModal();return}a=e.target.closest('[data-addtask]');if(a){taskModal(a.dataset.addtask);return}a=e.target.closest('[data-editrecord]');if(a){recordModal(a.dataset.editrecord);return}a=e.target.closest('[data-edittask]');if(a){let item=state.tasks.find(x=>x.id===a.dataset.edittask);taskModal(item.area,a.dataset.edittask);return}a=e.target.closest('[data-editmemory]');if(a){memoryModal(a.dataset.editmemory);return}a=e.target.closest('[data-delete]');if(a){let[k,id]=a.dataset.delete.split(':');await deletion(k,id);return}a=e.target.closest('[data-preview]');if(a){await preview(a.dataset.preview);return}if(e.target.id==='export'){await exportAll()}});
document.addEventListener('change',e=>{if(e.target.dataset.toggle){let x=state.tasks.find(t=>t.id===e.target.dataset.toggle);if(x){x.done=e.target.checked;save();render()}}if(e.target.id==='importFile'){importAll(e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();let f=new FormData(e.target);for(let [k,v]of f)state.settings[k]=Number(v)||0;save();render();toast('تم حفظ الإعدادات')}});
(async()=>{try{db=await openDB();let saved=await dbRead('data','state');if(saved){state={...state,...saved,journal:Array.isArray(saved.journal)?saved.journal:[],objectives:Array.isArray(saved.objectives)?saved.objectives:[],settings:{...state.settings,...saved.settings}}}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){$('#app').innerHTML=`<div class="empty">تعذر فتح التخزين المحلي في هذا المتصفح. افتح الموقع من متصفح يدعم IndexedDB مع السماح بتخزين بيانات المواقع.<p>${esc(e.message)}</p></div>`}})();
</script></body></html>
