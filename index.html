/* Hayati Finance 4.1: mobile-first, category-first expense experience */
.finance-hero{background:linear-gradient(135deg,#123b70,#1761a0);border:1px solid #4387bd;border-radius:22px;padding:21px;margin-bottom:15px;box-shadow:0 14px 35px #02081645}
.finance-hero .large{font-size:clamp(26px,6vw,39px);font-weight:850;line-height:1.3;font-variant-numeric:tabular-nums}
.finance-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.finance-actions button{min-height:51px;border-radius:14px;white-space:nowrap}
.finance-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.finance-mini{background:#102b4e;border:1px solid #315679;border-radius:15px;padding:13px 10px}
.finance-mini strong{display:block;font-size:clamp(15px,3vw,22px);font-variant-numeric:tabular-nums}
.finance-mini .muted{font-size:12px}
.finance-tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.finance-tile{background:linear-gradient(160deg,#163454,#102943);border:1px solid #34587f;border-radius:15px;color:#f2f8ff;text-align:center;padding:12px 5px;min-height:89px}
.finance-tile:hover,.finance-tile:focus{border-color:#6ab5ff;background:#20527d}
.finance-tile .tile-icon{display:block;font-size:25px;line-height:30px}
.finance-tile small{display:block;color:#b8cee9;font-size:11px}
.finance-section{margin:19px 0}
.finance-panel{border:1px solid #315575;background:#10233f;border-radius:18px;padding:17px}
.finance-meter{height:11px;background:#2d4864;border-radius:14px;overflow:hidden;margin-top:9px}
.finance-meter>span{display:block;height:100%;background:linear-gradient(90deg,#298eff,#43c9b7);border-radius:inherit}
.finance-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.finance-day{padding:7px 2px;border-radius:10px;min-height:50px;background:#102a48;border:1px solid #254665;color:#cce1f9;font-size:12px}
.finance-day.current{border-color:#8abaff}
.finance-day.active{background:#1d4770}
.finance-day .day-expense{display:block;color:#ffaab4;font-size:10px;font-variant-numeric:tabular-nums}
.finance-date-select{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.finance-date-select input{width:155px}
.finance-add-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}
.finance-add-kinds button{border:1px solid #385c82;background:#193958;color:white;border-radius:12px;padding:10px 5px}
.finance-add-kinds button.chosen{background:#2466ac;border-color:#66aefa}
.finance-cat-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.finance-cat-picker button{border:1px solid #3c5877;background:#142e4c;color:white;border-radius:12px;padding:9px 4px;min-height:69px}
.finance-cat-picker button.chosen{background:#225b99;border-color:#69aff5}
.finance-cat-picker .emoji{display:block;font-size:23px}
.finance-cat-picker small{display:block;font-size:11px}
.finance-sub-picker{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.finance-sub-picker button{border:1px solid #3d5c7e;background:#142a46;color:#e0edfc;border-radius:24px;padding:7px 11px}
.finance-sub-picker button.chosen{background:#2369a6;border-color:#70b7ff}
.finance-amount{font-size:29px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums}
.finance-callout{border-right:3px solid #6acbb7;background:#123346;color:#b9e9df;padding:11px;border-radius:10px;font-size:12px;margin:9px 0}
@media(max-width:650px){.finance-tile-grid{grid-template-columns:repeat(3,1fr)}.finance-stats{grid-template-columns:repeat(2,1fr)}.finance-actions button{padding:10px 5px;font-size:12px}}

/* Finance 4.2 insights: isolated styles, no schema migration */
.report-shell{border:1px solid #365a7f;border-radius:20px;background:#10233e;padding:17px;margin:20px 0}
.report-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:13px 0 18px}
.report-nav button{font-size:12px;color:#bfd9f2;background:#183653;border:1px solid #345878;padding:11px 3px;border-radius:11px}
.report-nav button.active{background:#2774bd;color:#fff;border-color:#8bc7ff}
.report-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.report-kpi{padding:13px;background:#173454;border-radius:12px;border:1px solid #335574}
.report-kpi small{display:block;color:#bdd2e8}.report-kpi strong{font-size:20px;display:block;margin-top:4px}
.report-layout{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;margin:16px 0}
.report-ring{width:172px;height:172px;max-width:100%;border-radius:50%;margin:auto;display:grid;place-items:center}
.report-ring-hole{background:#10233e;border-radius:50%;width:74%;height:74%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.report-ring-hole strong{font-size:21px}.report-ring-hole small{font-size:11px;color:#a7c9e7}
.report-legend{display:grid;gap:12px}.report-legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.report-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:7px}
.report-bar{height:9px;background:#26425e;border-radius:12px;overflow:hidden;margin-top:8px}
.report-bar span{display:block;height:100%;background:#63ace8}
.report-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:13px 0}
.report-period{display:flex;align-items:center;gap:10px}.report-period button{padding:5px 12px}
.report-period b{font-variant-numeric:tabular-nums}
.report-grid{display:grid;gap:10px}.report-stat-row{border:1px solid #2b4d6c;background:#142d49;padding:12px;border-radius:12px}
.report-stat-row .report-title{display:flex;align-items:center;justify-content:space-between;gap:9px}
.report-hint{font-size:12px;line-height:1.6;color:#aec9e4}
.report-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.report-form label{font-size:12px}.report-form select,.report-form input{width:100%}
.report-trend{display:flex;gap:6px;align-items:flex-end;min-height:135px;border-bottom:1px solid #3c5877;padding:12px 3px 0}
.report-trend-col{flex:1;min-width:0;display:flex;align-items:center;flex-direction:column;gap:6px}
.report-trend-bars{height:104px;display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center}
.report-trend-bars i{width:42%;min-height:0;border-radius:5px 5px 0 0;display:block}
.report-trend-col small{font-size:10px;color:#b5d1ea;text-align:center}
@media(max-width:550px){.report-shell{padding:12px}.report-layout{grid-template-columns:1fr;gap:12px}.report-ring{width:155px;height:155px}.report-nav button{font-size:10px;padding:10px 1px}.report-kpi strong{font-size:17px}}

<script>
'use strict';
const $=s=>document.querySelector(s), fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}), cash=n=>fmt(n)+' ر.س', dnow=()=>localDate(new Date()), localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2), esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])), datefmt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('ar-SA-u-nu-latn',{year:'numeric',month:'short',day:'numeric'}):'—';

const DEFAULT_STATE={records:[],tasks:[],habits:[],memories:[],journal:[],objectives:[],reminders:[],settings:{monthlySave:0,weeklyLimit:0,monthlyLimit:0,weddingBudget:0,weddingYear:2031,openingSpend:0,openingSavings:0,openingInvest:0,enabledModules:null,displayName:'',theme:'dark',quietStart:'22:00',quietEnd:'08:00'},accounts:[],courses:[],studySessions:[],carLogs:[],financeCategories:[],categoryLimits:{},carProfile:{model:'',plate:'',odometer:0,insurance:'',inspection:'',oilKm:0},bills:[]};
let state=structuredClone(DEFAULT_STATE),tab='dashboard',filter='all',db,user=null,authSession=null,authMode='login',syncStatus='idle',syncError='',refreshing=null,needsUsernameClaim=false,accountUsername='',recoveryDisplay=null;
const BACKEND=window.HAYATI_CONFIG||{},configured=!!(BACKEND.supabaseUrl&&BACKEND.supabaseAnonKey&&/^https:\/\//.test(BACKEND.supabaseUrl)&&!BACKEND.supabaseUrl.includes('YOUR_'));
const authStore='hayati-v6-session';

const DB_NAME='hayati-v6-user-';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME+user.id,1);r.onupgradeneeded=()=>{let b=r.result;b.createObjectStore('data');b.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbRead(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbWrite(store,key,value){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function dbAllFiles(){return new Promise((res,rej)=>{const r=db.transaction('files','readonly').objectStore('files').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let saving=Promise.resolve();function save(){
 if(!user||!db)return Promise.reject(Error('يجب تسجيل الدخول'));
 const userId=user.id, snapshot=structuredClone(state);
 saving=saving.catch(()=>{}).then(async()=>{
  if(!user||user.id!==userId)return;
  await dbWrite('data','state',snapshot);
  syncStatus='syncing';
  try{await remoteSave(snapshot,userId);localStorage.removeItem('hayati-v6-pending-'+userId);syncStatus='synced';syncError=''}
  catch(e){syncStatus='error';syncError=e.message;localStorage.setItem('hayati-v6-pending-'+userId,'1');toast('حُفظت البيانات محليًا، تعذرت المزامنة: '+e.message)}
 });return saving;
}
function toast(message){let t=$('#toast');t.textContent=message;t.classList.remove('hide');clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.add('hide'),3800)}

function accountList(){return [...coreAccounts,...(Array.isArray(state.accounts)?state.accounts:[])];}
function accountName(id){return accountList().find(a=>a.id===id)?.name||'حساب غير معروف';}
function recordAccounts(r){if(r.type==='transfer')return {from:r.from||'personal',to:r.to||'savings'};
if(r.type==='save')return {from:'personal',to:'savings'};
if(r.type==='unsave')return {from:'savings',to:'personal'};
if(r.type==='invest')return {from:'personal',to:'investment'};
if(r.type==='uninvest')return {from:'investment',to:'personal'};
if(r.type==='profit')return {to:r.account||'investment'};

function accountBalances(){let s=state.settings||{},balances={personal:Number(s.openingSpend)||0,savings:Number(s.openingSavings)||0,investment:Number(s.openingInvest)||0};for(let a of state.accounts||[])balances[a.id]=Number(a.opening)||0;
for(let r of state.records||[]){let amount=Number(r.amount)||0,a=recordAccounts(r);if(r.type==='expense')balances[a.account]=(balances[a.account]||0)-amount;else if(r.type==='income')balances[a.account]=(balances[a.account]||0)+amount;else if(r.type==='profit')balances[a.to]=(balances[a.to]||0)+amount;else {balances[a.from]=(balances[a.from]||0)-amount;balances[a.to]=(balances[a.to]||0)+amount;}}
return balances;}
function recordTotals(){let b=accountBalances(),income=0,expense=0;for(let r of state.records||[]){if(r.type==='income')income+=Number(r.amount)||0;if(r.type==='expense')expense+=Number(r.amount)||0;}return {spend:b.personal||0,savings:b.savings||0,invest:b.investment||0,income,expense};}
function financialMonth(date){return (date||dnow()).slice(0,7)}
function monthStats(month){let tx=state.records.filter(r=>financialMonth(r.date)===month),income=0,expense=0;let cats={};for(let r of tx){let a=Number(r.amount)||0;if(r.type==='income')income+=a;if(r.type==='expense'){expense+=a;let c=r.category||'أخرى';cats[c]=(cats[c]||0)+a;}}return {income,expense,net:income-expense,cats,count:tx.length};}

function weekly(){let n=new Date(),day=(n.getDay()+6)%7,start=new Date(n.getFullYear(),n.getMonth(),n.getDate()-day),end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6),a=localDate(start),b=localDate(end);let used=state.records.filter(r=>r.type==='expense'&&r.date>=a&&r.date<=b).reduce((s,r)=>s+r.amount,0);return {used,left:(state.settings.weeklyLimit||0)-used,a,b}}
function dailyAdvice(){let t=recordTotals(),w=weekly(),today=dnow(),due=state.tasks.filter(x=>!x.done&&x.date&&x.date<=today).sort((a,b)=>a.date.localeCompare(b.date)),upcoming=state.tasks.filter(x=>!x.done&&x.date&&x.date>today).sort((a,b)=>a.date.localeCompare(b.date)),goals=state.objectives.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),notes=[];
if(due.length)notes.push({icon:'📌',title:'مهام تحتاج اهتمامك',body:`لديك ${due.length} مهمة مستحقة أو متأخرة. ابدأ بـ «${due[0].title}».`,target:'tasks'});
if(w.left<0)notes.push({icon:'⚠️',title:'الميزانية تجاوزت الحد',body:`تجاوزت ميزانيتك الأسبوعية بمقدار ${cash(-w.left)}. راجع المصاريف غير الضرورية.`,target:'finance'});
else if(state.settings.weeklyLimit>0&&w.left<state.settings.weeklyLimit*.25)notes.push({icon:'💳',title:'الميزانية تقترب من الحد',body:`بقي ${cash(w.left)} لهذا الأسبوع.`,target:'finance'});
if(goals.length)notes.push({icon:'🎯',title:'خطوة نحو هدفك',body:`تابع «${goals[0].title}» وحدّث تقدّمك عند إنجاز خطوة حقيقية.`,target:'objectives'});

if(!state.journal.some(x=>x.date===today))notes.push({icon:'📖',title:'وثّق يومك',body:'سجل حدثًا واحدًا أو فكرة من يومك ليسهل إعداد تقريرك لاحقًا.',target:'journal'});
return `<section class="section">${head('مساعد يومي بدون اشتراك','اقتراحات قائمة على البيانات المسجلة على جهازك، وليست ذكاءً اصطناعيًا متصلًا بالإنترنت')}<div class="list">${notes.slice(0,4).map(n=>`<div class="entry"><div class="detail"><h3>${n.icon} ${esc(n.title)}</h3><p class="muted">${esc(n.body)}</p></div><button class="secondary small" data-go="${n.target}">فتح</button></div>`).join('')||'<div class="empty">لا توجد تنبيهات. يمكنك إضافة أهداف أو مهام أو أحداث يومية.</div>'}</div></section>`}
function dashboard(){const totals=recordTotals(),w=weekly(),month=financialMonth(),stats=monthStats(month),todos=state.tasks.filter(x=>!x.done),due=todos.filter(x=>x.date&&x.date<=dnow()).sort((a,b)=>a.date.localeCompare(b.date)),near=todos.filter(x=>x.date&&x.date>dnow()).sort((a,b)=>a.date.localeCompare(b.date)),courseCount=(state.courses||[]).length,carCount=(state.carLogs||[]).length,goalCount=(state.objectives||[]).filter(x=>!x.done).length,weekCap=Number(state.settings.weeklyLimit)||0,percent=weekCap>0?Math.min(100,Math.round(100*w.used/weekCap)):0;
let n=due.length?`عندك ${due.length} مهام مستحقة أو متأخرة، وأولها «${esc(due[0].title||'مهمة')}».`:near.length?`أقرب مهمة قادمة: «${esc(near[0].title||'مهمة')}» بتاريخ ${esc(near[0].date)}.`:'ما عندك مهام مستحقة مسجلة، تقدر تضيف خطة جديدة ليومك.';
return `<section class="focus-hero"><div class="hayati-kicker">HAYATI / PERSONAL COMMAND CENTER</div><h2>أهلًا ${esc(state.settings.displayName||user?.user_metadata?.display_name||'بك')} ✦</h2><p>كل جانب من حياتك واضح أمامك. رصيدك، أهدافك، ودراستك وسيارتك من مكان واحد.</p><div class="row"><span class="focus-chip">📆 ${datefmt(dnow())}</span><span class="focus-chip">🎯 ${goalCount} أهداف قيد المتابعة</span><span class="focus-chip">✅ ${todos.length} مهام مفتوحة</span></div></section>
${isEnabled('finance')?`<section class="section"><div class="section-head"><div><h2>ملخص حياتك المالي</h2><p class="muted">الأرقام من سجلاتك المحلية وليست من البنك مباشرة</p></div><button class="secondary small" data-go="finance">فتح المالية ↗</button></div><div class="cards">${card('رصيدي الشخصي',cash(totals.spend),'المتاح في الحساب الأساسي')}${card('مدخراتي',cash(totals.savings),'مبلغ مستقل')}${card('استثماراتي',cash(totals.invest),'العائد غير مضمون')}${card('مصروف هذا الشهر',cash(stats.expense),month)}${card('المتبقي من ميزانية الأسبوع',cash(w.left),'من أصل '+cash(weekCap))}${card('دخل هذا الشهر',cash(stats.income),'عمليات الدخل المسجلة')}</div></section>`:''}
${isEnabled('finance')?`<section class="section-snapshot"><div class="section-head"><div><h2>ميزانية هذا الأسبوع</h2><p class="muted">${cash(w.used)} مصروف من حد ${cash(weekCap)}</p></div><strong class="${w.left<0?'money-neg':'money-pos'}">${percent}%</strong></div><div class="hayati-progress"><span style="width:${percent}%"></span></div><div class="row" style="margin-top:12px"><button class="primary" data-fastkind="expense">+ تسجيل مصروف</button><button class="secondary" data-go="finance">تفاصيل الميزانية</button></div></section>`:''}
<section class="section"><div class="section-head"><h2>أولوية اليوم</h2><button class="ghost" data-go="tasks">كل المهام</button></div><div class="hayati-insight"><span class="emoji">${due.length?'⏰':'✨'}</span><div><b>${due.length?'في انتظار إنجازك':'خطتك اليومية'}</b><p>${n}</p><div class="buttons"><button class="secondary" data-go="tasks">إدارة المهام</button><button class="secondary" data-go="journal">تسجيل يومي</button></div></div></div></section>

${isEnabled('finance')?dailyAdvice():''}${upcomingReminders()}<section class="section">${head('جميع أقسام حياتي','بقية أقسامك متاحة كما كانت، دون حذف أي سجلات')}<div class="modules">${modules.filter(m=>m[0]!=='dashboard'&&isEnabled(m[0])).map(m=>`<button class="module" data-go="${m[0]}"><span class="emoji">${m[1]}</span><b>${m[2]}</b></button>`).join('')}</div></section><div class="note">المعلومات النصية تتزامن مع حسابك عند نجاح الاتصال. ملفات الصور والفيديوهات على هذا الجهاز فقط؛ صدّر نسخة احتياطية لها من الإعدادات.</div>`}
const typenames={income:'دخل / هدية',expense:'مصروف',transfer:'تحويل بين الحسابات',save:'تحويل إلى الادخار',unsave:'سحب من الادخار',invest:'تحويل إلى الاستثمار',uninvest:'سحب من الاستثمار',profit:'أرباح استثمار'};
function transactionLabel(r){let a=recordAccounts(r);return ['transfer','save','unsave','invest','uninvest'].includes(r.type)?accountName(a.from)+' ← '+accountName(a.to):accountName(a.account||a.to);}

const financePreset=[

 form.onsubmit=async e=>{e.preventDefault();let f=new FormData(form),amount=Number(f.get('amount')),account=String(f.get('account')),to=String(f.get('to')),date=String(f.get('date'));if(!Number.isFinite(amount)||amount<=0){toast('أدخل مبلغًا صحيحًا');return}if(type==='transfer'&&account===to){toast('اختر حسابين مختلفين');return}let cat=financeCat(id),item={id:uid(),type,amount,date,title:String(f.get('title')||'').trim(),category:type==='expense'?`${cat.name} / ${sub}`:type==='income'?'دخل':'تحويل',...(type==='expense'?{categoryId:id,subcategory:sub}:{}),...(type==='transfer'?{from:account,to}:{account})};state.records.push(item);await save();$('#modal').close();render();toast('تم تسجيل العملية بنجاح')};

function bytesToBase64(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function base64ToBlob(data,type){let raw=atob(data),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return new Blob([arr],{type:type||'application/octet-stream'})}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}

// ========= HAYATI 6 · ACCOUNTS, MODULES & REMINDERS =========
function backendUrl(path){return BACKEND.supabaseUrl.replace(/\/$/,'')+path}
async function api(path,method='GET',payload,token){
 let headers={'apikey':BACKEND.supabaseAnonKey,'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 let res=await fetch(backendUrl(path),{method,headers,body:payload===undefined?undefined:JSON.stringify(payload),cache:'no-store'});
 let raw=await res.text(),body;try{body=raw?JSON.parse(raw):null}catch{body={message:raw}}
 if(!res.ok)throw Error(body?.msg||body?.error_description||body?.message||body?.error||('HTTP '+res.status));
 return body;
}
async function liveToken(){
 if(!authSession)throw Error('انتهت الجلسة');
 if(Date.now()<(authSession.expires_at||0)*1000-90000)return authSession.access_token;
 if(!refreshing)refreshing=(async()=>{
  try{let r=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:authSession.refresh_token});setSession(r);return r.access_token}
  catch(e){authSession=null;user=null;localStorage.removeItem(authStore);render();throw Error('انتهت الجلسة، سجّل الدخول مرة أخرى')}
  finally{refreshing=null}
 })();return refreshing;
}
function setSession(s){authSession={access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||Math.floor(Date.now()/1000)+Number(s.expires_in||3600),user:s.user};localStorage.setItem(authStore,JSON.stringify(authSession))}
async function remoteRead(){const token=await liveToken();const rows=await api('/rest/v1/hayati_user_data?select=data&user_id=eq.'+encodeURIComponent(user.id),'GET',undefined,token);return rows?.[0]?.data||null}
async function remoteSave(snapshot,expectedId){if(!user||user.id!==expectedId)throw Error('تغير الحساب');let token=await liveToken();let response=await fetch(backendUrl('/rest/v1/hayati_user_data?on_conflict=user_id'),{method:'POST',headers:{'apikey':BACKEND.supabaseAnonKey,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:expectedId,data:snapshot})});if(!response.ok){let j=await response.text();throw Error('تعذر رفع السجلات ('+response.status+'): '+j.slice(0,130))}}
async function initializeUser(){
 if(!authSession)return;
 const tok=await liveToken();user=await api('/auth/v1/user','GET',undefined,tok);if(!user?.id)throw Error('لم يتم التعرف على الحساب');const account=await accountApi({action:'status'},tok);accountUsername=account.username||'';needsUsernameClaim=!accountUsername;
 db=await openDB();let local=await dbRead('data','state');let remote=await remoteRead();
 // Cloud is authoritative, even after reinstallation; never import legacy shared data silently.
 let pending=localStorage.getItem('hayati-v6-pending-'+user.id)==='1';let chosen=pending&&local?local:remote||local||DEFAULT_STATE;

function reminderOccurrences(r){if(r.done)return null;let dt=new Date(r.at);if(Number.isNaN(+dt))return null;let now=Date.now();if(r.repeat==='daily'||r.repeat==='weekly'||r.repeat==='monthly'){let count=0;while(+dt < now-86400000 && count++<500){if(r.repeat==='daily')dt.setDate(dt.getDate()+1);else if(r.repeat==='weekly')dt.setDate(dt.getDate()+7);else dt.setMonth(dt.getMonth()+1)}}return dt}
function dueReminderList(){let result=[];for(let r of state.reminders||[]){let dt=reminderOccurrences(r);if(dt)result.push({...r,next:dt})}for(let t of state.tasks||[]){if(t.done||!t.date)continue;let dt=new Date(t.date+'T09:00:00');if(Number.isNaN(+dt))continue;result.push({id:'task-'+t.id,title:t.title,at:dt.toISOString(),next:dt,area:t.area,minutesBefore:0,source:'task'})}return result.sort((a,b)=>+a.next-+b.next)}

document.addEventListener('change',e=>{if(e.target.dataset.toggle){let x=state.tasks.find(t=>t.id===e.target.dataset.toggle);if(x){x.done=e.target.checked;save();render()}}if(e.target.id==='importFile'){importAll(e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();let f=new FormData(e.target);for(let [k,v]of f)state.settings[k]=Number(v)||0;save();render();toast('تم حفظ الإعدادات')}});
(async()=>{if(!configured){render();return}try{let v=JSON.parse(localStorage.getItem(authStore)||'null');if(v?.access_token&&v?.refresh_token){authSession=v;await initializeUser()}}catch(e){console.warn('Auth initialization:',e);authSession=null;user=null;localStorage.removeItem(authStore)}render();setInterval(()=>{if(user)checkReminders()},30*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user){checkReminders();retrySync()}})} )();
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
