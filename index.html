/* Hayati Finance 4.1: mobile-first, category-first expense experience */
.finance-hero{background:linear-gradient(135deg,#123b70,#1761a0);border:1px solid #4387bd;border-radius:22px;padding:21px;margin-bottom:15px;box-shadow:0 14px 35px #02081645}
.finance-hero .large{font-size:clamp(26px,6vw,39px);font-weight:850;line-height:1.3;font-variant-numeric:tabular-nums}
.finance-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.finance-actions button{min-height:51px;border-radius:14px;white-space:nowrap}
.finance-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.finance-mini{background:#102b4e;border:1px solid #315679;border-radius:15px;padding:13px 10px}
.finance-mini strong{display:block;font-size:clamp(15px,3vw,22px);font-variant-numeric:tabular-nums}
.finance-mini .muted{font-size:12px}
.finance-tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.finance-tile{background:linear-gradient(160deg,#163454,#102943);border:1px solid #34587f;border-radius:15px;color:#f2f8ff;text-align:center;padding:12px 5px;min-height:89px}
.finance-tile:hover,.finance-tile:focus{border-color:#6ab5ff;background:#20527d}
.finance-tile .tile-icon{display:block;font-size:25px;line-height:30px}
.finance-tile small{display:block;color:#b8cee9;font-size:11px}
.finance-section{margin:19px 0}
.finance-panel{border:1px solid #315575;background:#10233f;border-radius:18px;padding:17px}
.finance-meter{height:11px;background:#2d4864;border-radius:14px;overflow:hidden;margin-top:9px}
.finance-meter>span{display:block;height:100%;background:linear-gradient(90deg,#298eff,#43c9b7);border-radius:inherit}
.finance-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.finance-day{padding:7px 2px;border-radius:10px;min-height:50px;background:#102a48;border:1px solid #254665;color:#cce1f9;font-size:12px}
.finance-day.current{border-color:#8abaff}
.finance-day.active{background:#1d4770}
.finance-day .day-expense{display:block;color:#ffaab4;font-size:10px;font-variant-numeric:tabular-nums}
.finance-date-select{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.finance-date-select input{width:155px}
.finance-add-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}
.finance-add-kinds button{border:1px solid #385c82;background:#193958;color:white;border-radius:12px;padding:10px 5px}
.finance-add-kinds button.chosen{background:#2466ac;border-color:#66aefa}
.finance-cat-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.finance-cat-picker button{border:1px solid #3c5877;background:#142e4c;color:white;border-radius:12px;padding:9px 4px;min-height:69px}
.finance-cat-picker button.chosen{background:#225b99;border-color:#69aff5}
.finance-cat-picker .emoji{display:block;font-size:23px}
.finance-cat-picker small{display:block;font-size:11px}
.finance-sub-picker{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.finance-sub-picker button{border:1px solid #3d5c7e;background:#142a46;color:#e0edfc;border-radius:24px;padding:7px 11px}
.finance-sub-picker button.chosen{background:#2369a6;border-color:#70b7ff}
.finance-amount{font-size:29px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums}
.finance-callout{border-right:3px solid #6acbb7;background:#123346;color:#b9e9df;padding:11px;border-radius:10px;font-size:12px;margin:9px 0}
@media(max-width:650px){.finance-tile-grid{grid-template-columns:repeat(3,1fr)}.finance-stats{grid-template-columns:repeat(2,1fr)}.finance-actions button{padding:10px 5px;font-size:12px}}

/* Finance 4.2 insights: isolated styles, no schema migration */
.report-shell{border:1px solid #365a7f;border-radius:20px;background:#10233e;padding:17px;margin:20px 0}
.report-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:13px 0 18px}
.report-nav button{font-size:12px;color:#bfd9f2;background:#183653;border:1px solid #345878;padding:11px 3px;border-radius:11px}
.report-nav button.active{background:#2774bd;color:#fff;border-color:#8bc7ff}
.report-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.report-kpi{padding:13px;background:#173454;border-radius:12px;border:1px solid #335574}
.report-kpi small{display:block;color:#bdd2e8}.report-kpi strong{font-size:20px;display:block;margin-top:4px}
.report-layout{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;margin:16px 0}
.report-ring{width:172px;height:172px;max-width:100%;border-radius:50%;margin:auto;display:grid;place-items:center}
.report-ring-hole{background:#10233e;border-radius:50%;width:74%;height:74%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.report-ring-hole strong{font-size:21px}.report-ring-hole small{font-size:11px;color:#a7c9e7}
.report-legend{display:grid;gap:12px}.report-legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.report-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:7px}
.report-bar{height:9px;background:#26425e;border-radius:12px;overflow:hidden;margin-top:8px}
.report-bar span{display:block;height:100%;background:#63ace8}
.report-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:13px 0}
.report-period{display:flex;align-items:center;gap:10px}.report-period button{padding:5px 12px}
.report-period b{font-variant-numeric:tabular-nums}
.report-grid{display:grid;gap:10px}.report-stat-row{border:1px solid #2b4d6c;background:#142d49;padding:12px;border-radius:12px}
.report-stat-row .report-title{display:flex;align-items:center;justify-content:space-between;gap:9px}
.report-hint{font-size:12px;line-height:1.6;color:#aec9e4}
.report-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.report-form label{font-size:12px}.report-form select,.report-form input{width:100%}
.report-trend{display:flex;gap:6px;align-items:flex-end;min-height:135px;border-bottom:1px solid #3c5877;padding:12px 3px 0}
.report-trend-col{flex:1;min-width:0;display:flex;align-items:center;flex-direction:column;gap:6px}
.report-trend-bars{height:104px;display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center}
.report-trend-bars i{width:42%;min-height:0;border-radius:5px 5px 0 0;display:block}
.report-trend-col small{font-size:10px;color:#b5d1ea;text-align:center}
@media(max-width:550px){.report-shell{padding:12px}.report-layout{grid-template-columns:1fr;gap:12px}.report-ring{width:155px;height:155px}.report-nav button{font-size:10px;padding:10px 1px}.report-kpi strong{font-size:17px}}
</style>
</head><body><div class="app"><header><div class="top"><div class="logo">✦</div><div class="brand"><h1>حياتي</h1><small>مساحتك الشخصية · الإصدار 4.2 · بدون اشتراك</small></div></div><span class="pill" id="today"></span></header><main id="app"></main></div><nav class="nav" id="nav"></nav><dialog id="modal"><button class="ghost close" onclick="modal.close()">✕ إغلاق</button><div id="modalBody" style="clear:both;padding-top:12px"></div></dialog><div class="toast hide" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}), cash=n=>fmt(n)+' ر.س', dnow=()=>localDate(new Date()), localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2), esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])), datefmt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('ar-SA-u-nu-latn',{year:'numeric',month:'short',day:'numeric'}):'—';
const modules=[['dashboard','🏠','الرئيسية'],['journal','📖','سجل حياتي'],['objectives','🎯','أهداف حياتي'],['finance','💳','المالية المطوّرة'],['goals','💰','الادخار والاستثمار'],['future','💍','الزواج والمستقبل'],['study','🎓','الجامعة'],['health','💙','الصحة والعادات'],['car','🚘','سيارتي'],['relationships','🤍','العلاقات'],['memories','📷','ذكرياتي'],['tasks','🗓️','المهام والتقويم'],['settings','⚙️','الإعدادات']];
let state={records:[],tasks:[],habits:[],memories:[],journal:[],objectives:[],settings:{monthlySave:2000,weeklyLimit:240,monthlyLimit:0,weddingBudget:100000,weddingYear:2031,openingSpend:0,openingSavings:0,openingInvest:0},accounts:[],courses:[],studySessions:[],carLogs:[],financeCategories:[],categoryLimits:{},carProfile:{model:'GAC Empow 2026',plate:'',odometer:0,insurance:'',inspection:'',oilKm:0},bills:[]},tab='dashboard',filter='all',db;
const DB_NAME='hayati-v1';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{let b=r.result;b.createObjectStore('data');b.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbRead(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbWrite(store,key,value){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function dbAllFiles(){return new Promise((res,rej)=>{const r=db.transaction('files','readonly').objectStore('files').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let saving=Promise.resolve();function save(){saving=saving.then(()=>dbWrite('data','state',state)).catch(e=>toast('تعذر الحفظ: '+e.message));return saving}
function toast(message){let t=$('#toast');t.textContent=message;t.classList.remove('hide');clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.add('hide'),3800)}
function go(id){tab=id;filter='all';render();scrollTo({top:0,behavior:'smooth'})}
function nav(){let ids=['dashboard','journal','objectives','memories','settings'];$('#nav').innerHTML=ids.map(id=>{let m=modules.find(z=>z[0]===id);return `<button class="${tab===id?'active':''}" data-go="${id}"><span class="ni">${m[1]}</span>${m[2]}</button>`}).join('')}
function head(name,sub,cta=''){return `<div class="section-head"><div><h2>${name}</h2>${sub?`<p class="muted">${sub}</p>`:''}</div>${cta}</div>`}
function card(title,num,sub=''){return `<div class="card"><div class="muted">${title}</div><strong class="big">${num}</strong><div class="muted">${sub}</div></div>`}
const coreAccounts=[{id:'personal',name:'الرصيد الشخصي',kind:'spend'},{id:'savings',name:'الادخار',kind:'save'},{id:'investment',name:'الاستثمار',kind:'invest'}];
function accountList(){return [...coreAccounts,...(Array.isArray(state.accounts)?state.accounts:[])];}
function accountName(id){return accountList().find(a=>a.id===id)?.name||'حساب غير معروف';}
function recordAccounts(r){if(r.type==='transfer')return {from:r.from||'personal',to:r.to||'savings'};
if(r.type==='save')return {from:'personal',to:'savings'};
if(r.type==='unsave')return {from:'savings',to:'personal'};
if(r.type==='invest')return {from:'personal',to:'investment'};
if(r.type==='uninvest')return {from:'investment',to:'personal'};
if(r.type==='profit')return {to:r.account||'investment'};
return {account:r.account||'personal'};}
function accountBalances(){let s=state.settings||{},balances={personal:Number(s.openingSpend)||0,savings:Number(s.openingSavings)||0,investment:Number(s.openingInvest)||0};for(let a of state.accounts||[])balances[a.id]=Number(a.opening)||0;
for(let r of state.records||[]){let amount=Number(r.amount)||0,a=recordAccounts(r);if(r.type==='expense')balances[a.account]=(balances[a.account]||0)-amount;else if(r.type==='income')balances[a.account]=(balances[a.account]||0)+amount;else if(r.type==='profit')balances[a.to]=(balances[a.to]||0)+amount;else {balances[a.from]=(balances[a.from]||0)-amount;balances[a.to]=(balances[a.to]||0)+amount;}}
return balances;}
function recordTotals(){let b=accountBalances(),income=0,expense=0;for(let r of state.records||[]){if(r.type==='income')income+=Number(r.amount)||0;if(r.type==='expense')expense+=Number(r.amount)||0;}return {spend:b.personal||0,savings:b.savings||0,invest:b.investment||0,income,expense};}
function financialMonth(date){return (date||dnow()).slice(0,7)}
function monthStats(month){let tx=state.records.filter(r=>financialMonth(r.date)===month),income=0,expense=0;let cats={};for(let r of tx){let a=Number(r.amount)||0;if(r.type==='income')income+=a;if(r.type==='expense'){expense+=a;let c=r.category||'أخرى';cats[c]=(cats[c]||0)+a;}}return {income,expense,net:income-expense,cats,count:tx.length};}

function weekly(){let n=new Date(),day=(n.getDay()+6)%7,start=new Date(n.getFullYear(),n.getMonth(),n.getDate()-day),end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6),a=localDate(start),b=localDate(end);let used=state.records.filter(r=>r.type==='expense'&&r.date>=a&&r.date<=b).reduce((s,r)=>s+r.amount,0);return {used,left:(state.settings.weeklyLimit||0)-used,a,b}}

if(due.length)notes.push({icon:'📌',title:'مهام تحتاج اهتمامك',body:`لديك ${due.length} مهمة مستحقة أو متأخرة. ابدأ بـ «${due[0].title}».`,target:'tasks'});

 return `<section class="finance-hero"><div class="muted">💳 ملخص أموالي · ${month}</div><div class="large">${cash(netWorth)}</div><div class="muted">إجمالي الأرصدة المسجلة، يشمل الادخار والاستثمار</div><div class="finance-actions"><button class="primary" data-fastkind="expense">− مصروف</button><button class="secondary" data-fastkind="income">+ دخل</button><button class="secondary" data-fastkind="transfer">⇄ تحويل</button></div></section>

function fastExpense(catId,day){let cats=financeCats(),id=catId&&financeCat(catId)?catId:'self',type='expense',subs=financeCat(id).subs||['أخرى'],sub=subs[0];showModal('إضافة عملية مالية سريعة',`<form id="quickExpenseForm" class="form-grid"><div class="full finance-add-kinds">${[['expense','− مصروف'],['income','+ دخل'],['transfer','⇄ تحويل']].map(([k,n])=>`<button type="button" data-qkind="${k}" class="${k==='expense'?'chosen':''}">${n}</button>`).join('')}</div><label class="full">المبلغ بالريال<input class="finance-amount" name="amount" inputmode="decimal" type="number" min="0.01" step=".01" required autofocus placeholder="0.00"></label><div id="fastCategories" class="full"><b>البند الرئيسي</b><div class="finance-cat-picker" id="fastCats"></div><b>البند الفرعي</b><div class="finance-sub-picker" id="fastSubs"></div></div><label>التاريخ<input type="date" name="date" required value="${day||dnow()}"></label><label id="quickAccountLabel">الحساب<select name="account">${accountList().map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></label><label id="quickToLabel" class="hide">إلى حساب<select name="to">${accountList().map(a=>`<option value="${esc(a.id)}" ${a.id==='savings'?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label class="full">ملاحظة (اختياري)<input name="title" maxlength="180" placeholder="مثل: قهوة المساء"></label><div class="full finance-callout">التحويل بين حساباتك لا يُحتسب مصروفًا، ولن يُخصم مرتين.</div><div class="full"><button class="primary" style="width:100%">حفظ العملية</button></div></form>`);
 const form=$('#quickExpenseForm'),catBox=$('#fastCats'),subBox=$('#fastSubs');function draw(){catBox.innerHTML=cats.map(c=>`<button type="button" data-qcat="${esc(c.id)}" class="${id===c.id?'chosen':''}"><span class="emoji">${esc(c.icon||'📁')}</span><small>${esc(c.name)}</small></button>`).join('');subBox.innerHTML=(financeCat(id)?.subs||['أخرى']).map(v=>`<button type="button" data-qsub="${esc(v)}" class="${v===sub?'chosen':''}">${esc(v)}</button>`).join('')};draw();form.addEventListener('click',e=>{let b=e.target.closest('[data-qkind]');if(b){type=b.dataset.qkind;form.querySelectorAll('[data-qkind]').forEach(x=>x.classList.toggle('chosen',x.dataset.qkind===type));$('#fastCategories').classList.toggle('hide',type!=='expense');$('#quickToLabel').classList.toggle('hide',type!=='transfer');$('#quickAccountLabel').firstChild.textContent=type==='transfer'?'من حساب':'الحساب';return}b=e.target.closest('[data-qcat]');if(b){id=b.dataset.qcat;sub=financeCat(id)?.subs?.[0]||'أخرى';draw();return}b=e.target.closest('[data-qsub]');if(b){sub=b.dataset.qsub;draw()}});
 form.onsubmit=async e=>{e.preventDefault();let f=new FormData(form),amount=Number(f.get('amount')),account=String(f.get('account')),to=String(f.get('to')),date=String(f.get('date'));if(!Number.isFinite(amount)||amount<=0){toast('أدخل مبلغًا صحيحًا');return}if(type==='transfer'&&account===to){toast('اختر حسابين مختلفين');return}let cat=financeCat(id),item={id:uid(),type,amount,date,title:String(f.get('title')||'').trim(),category:type==='expense'?`${cat.name} / ${sub}`:type==='income'?'دخل':'تحويل',...(type==='expense'?{categoryId:id,subcategory:sub}:{}),...(type==='transfer'?{from:account,to}:{account})};state.records.push(item);await save();$('#modal').close();render();toast('تم تسجيل العملية بنجاح')};
}
function categoryModal(){showModal('إضافة بند رئيسي',`<form id="categoryForm" class="form-grid"><label>اسم البند<input name="name" required maxlength="50" placeholder="مثل: هدايا"></label><label>رمز تعبيري<input name="icon" maxlength="4" value="📁"></label><label class="full">البنود الفرعية (افصل بينها بفاصلة)<input name="subs" required maxlength="280" placeholder="مناسبات، شراء هدايا، أخرى"></label><div class="full"><button class="primary">إضافة البند</button></div></form>`);$('#categoryForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),subs=String(f.get('subs')||'').split(/[،,]/).map(x=>x.trim()).filter(Boolean);if(!name||!subs.length||financeCats().some(c=>c.name===name)){toast('الاسم موجود أو البيانات ناقصة');return}state.financeCategories=state.financeCategories||[];state.financeCategories.push({id:uid(),icon:String(f.get('icon')||'📁'),name,subs});await save();$('#modal').close();render();toast('تمت إضافة البند')};}

function financeCsv(){let rows=[['التاريخ','النوع','البيان','الفئة','المبلغ','الحساب أو التحويل'],...state.records.map(r=>[r.date,typenames[r.type]||r.type,r.title||'',r.category||'',r.amount,transactionLabel(r)])],content='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob([content],{type:'text/csv;charset=utf-8'}),'hayati-finance-'+dnow()+'.csv')}

 const bills=(state.bills||[]).slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''));
 const recent=[...new Set(state.records.map(r=>financialMonth(r.date)))].sort().reverse().slice(0,6);
 return `<section class="section">${head('الميزانية الشهرية والالتزامات','حد الإنفاق والأقساط والفواتير المسجلة، دون سحب أو ربط بنكي','<button class="secondary" data-action="bill">+ فاتورة / التزام</button>')}

function future(){let t=recordTotals(),s=state.settings,year=Number(s.weddingYear||2031),months=Math.max(0,(year-new Date().getFullYear())*12+(12-new Date().getMonth()-1));let projected=t.savings+months*Number(s.monthlySave||0);return `${head('الزواج والمستقبل','خطط بخيارات واقعية، وعدّل ميزانيتك من الإعدادات')}<div class="cards">${card('سنة الزواج المستهدفة',year)}${card('تكلفة الزواج المخططة',cash(s.weddingBudget))}${card('الادخار المتوقع قبل الموعد',cash(projected))}</div><section class="section"><div class="card"><h3>تقدير الفجوة المالية</h3><strong class="big" style="color:${projected>=s.weddingBudget?'var(--green)':'var(--gold)'}">${cash(projected-s.weddingBudget)}</strong><p class="muted">الفرق بين مدخراتك المتوقعة وتكلفة الزواج، دون احتساب رأس مال الاستثمار أو أرباحه. الحساب تقريبي ويعتمد على نهاية سنة الزواج.</p></div></section><section class="section"><div class="card"><h3>خطة عشر سنوات</h3><div class="table-wrap"><table><thead><tr><th>السنة</th><th>مدخراتي المتوقعة</th><th>بعد تكلفة الزواج (إن حدث)</th></tr></thead><tbody>${Array.from({length:10},(_,i)=>{let y=new Date().getFullYear()+i+1;let amount=t.savings+12*(i+1)*s.monthlySave;return `<tr><td>${y}</td><td>${cash(amount)}</td><td>${cash(amount-(y>=year?s.weddingBudget:0))}</td></tr>`}).join('')}</tbody></table></div></div></section><div class="note">هذه محاكاة ادخار وليست ميزانية معيشة بعد الزواج. عدّل المبلغ الشهري لاحقًا إذا تغير دخلك أو مصاريفك.</div>`}

function universityPage(){let courses=state.courses||[],sessions=state.studySessions||[],active=state.tasks.filter(t=>t.area==='study'&&!t.done).length,total=sessions.reduce((a,b)=>a+safeNum(b.minutes),0),weightGrades=courses.flatMap(c=>(c.grades||[]).map(g=>({...g,course:c.name}))),earned=weightGrades.reduce((a,g)=>a+(safeNum(g.score)/Math.max(1,safeNum(g.outOf)))*safeNum(g.weight),0),weights=weightGrades.reduce((a,g)=>a+safeNum(g.weight),0);
 return `${head('🎓 الجامعة','مقررات، درجات، مواعيد، جلسات مذاكرة وخطة تقدم فعلية','<div class="row"><button class="primary" data-action="course">+ مقرر</button><button class="secondary" data-action="session">+ جلسة مذاكرة</button><button class="secondary" data-addtask="study">+ اختبار / واجب</button></div>')}

 <section class="section">${head('مقرراتي','يمكن تسجيل عناصر الدرجات لكل مقرر وأوزانها')}<div class="list">${courses.length?courses.map(c=>{let gs=c.grades||[],w=gs.reduce((a,g)=>a+safeNum(g.weight),0),v=gs.reduce((a,g)=>a+safeNum(g.score)/Math.max(1,safeNum(g.outOf))*safeNum(g.weight),0),done=sessions.filter(x=>x.courseId===c.id).reduce((a,x)=>a+safeNum(x.minutes),0);return `<div class="entry"><div class="detail"><h3>${esc(c.code)} — ${esc(c.name)}</h3><small>${esc(c.tutor||'')} · ${esc(c.term||'فصل غير محدد')} · مذاكرة ${fmt(done)} دقيقة</small><p class="muted">${gs.length} تقييمات | ${w?`محصل ${fmt(v)} من وزن ${fmt(w)}%`:'لا توجد درجات بعد'} ${w>100?'⚠️ الأوزان تتجاوز 100%':''}</p>${gs.map(g=>`<p class="muted">${esc(g.name)}: ${fmt(g.score)} / ${fmt(g.outOf)} (وزن ${fmt(g.weight)}%) <button class="ghost" data-deletegrade="${c.id}:${g.id}">حذف الدرجة</button></p>`).join('')}</div><div class="actions"><button class="secondary small" data-grade="${c.id}">+ درجة</button><button class="ghost" data-editcourse="${c.id}">تعديل</button><button class="danger small" data-delete="courses:${c.id}">حذف</button></div></div>`}).join(''):'<div class="empty">أضف مقرراتك الجامعية أولًا.</div>'}</div></section>

function gradeModal(courseId){let c=state.courses.find(z=>z.id===courseId);if(!c)return;showModal('إضافة درجة إلى '+esc(c.name),`<form id="gradeForm" class="form-grid"><label class="full">نوع التقييم<input name="name" required maxlength="100" placeholder="اختبار منتصف الفصل"></label><label>الدرجة المحصلة<input name="score" type="number" required min="0" step=".01"></label><label>الدرجة الكاملة<input name="outOf" type="number" required min=".01" step=".01" value="100"></label><label>وزن التقييم من 100%<input name="weight" type="number" required min="0" max="100" step=".01"></label><div class="full"><button class="primary">حفظ الدرجة</button></div></form>`);$('#gradeForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),score=Number(f.get('score')),outOf=Number(f.get('outOf')),weight=Number(f.get('weight'));if(!(outOf>0)||score<0||score>outOf||weight<0||weight>100){toast('راجع الدرجة والوزن');return;}let sum=(c.grades||[]).reduce((a,g)=>a+safeNum(g.weight),0);if(sum+weight>100.001){toast('إجمالي أوزان المقرر لا يمكن أن يتجاوز 100%');return;}c.grades=[...(c.grades||[]),{id:uid(),name:String(f.get('name')),score,outOf,weight}];await save();$('#modal').close();render()}}
function sessionModal(id){let x=state.studySessions.find(a=>a.id===id)||{courseId:state.courses[0]?.id||'',date:dnow(),minutes:30,notes:''};if(!state.courses.length){toast('أضف مقررًا أولًا');return;}showModal(id?'تعديل جلسة':'إضافة جلسة مذاكرة',`<form id="sessionForm" class="form-grid"><label>المقرر<select name="courseId">${state.courses.map(c=>`<option value="${c.id}" ${x.courseId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>التاريخ<input type="date" name="date" required value="${x.date}"></label><label>مدة المذاكرة بالدقائق<input name="minutes" type="number" min="1" max="1440" required value="${x.minutes}"></label><label class="full">وش ذاكرْت؟<textarea name="notes">${esc(x.notes)}</textarea></label><div class="full"><button class="primary">حفظ الجلسة</button></div></form>`);$('#sessionForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),n=Number(f.get('minutes'));if(!Number.isInteger(n)||n<1||n>1440)return;let z={id:id||uid(),courseId:String(f.get('courseId')),date:String(f.get('date')),minutes:n,notes:String(f.get('notes'))};if(id)state.studySessions=state.studySessions.map(y=>y.id===id?z:y);else state.studySessions.push(z);await save();$('#modal').close();render()}}
function carPage(){let p=state.carProfile||{},logs=state.carLogs||[],total=logs.reduce((a,x)=>a+safeNum(x.cost),0),fuel=logs.filter(x=>x.kind==='بنزين'),liters=fuel.reduce((a,x)=>a+safeNum(x.liters),0),fuelCost=fuel.reduce((a,x)=>a+safeNum(x.cost),0),next=logs.filter(x=>x.nextDate&&x.nextDate>=dnow()).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));

let form=$('#recordForm'),refresh=()=>{let t=form.elements.type.value,transfer=['transfer','save','unsave','invest','uninvest'].includes(t),profit=t==='profit';$('#financeAccountLabel').classList.toggle('hide',transfer||profit);$('#financeFromLabel').classList.toggle('hide',!transfer);$('#financeToLabel').classList.toggle('hide',!transfer&&!profit);if(t==='save'){form.elements.from.value='personal';form.elements.to.value='savings'}if(t==='unsave'){form.elements.from.value='savings';form.elements.to.value='personal'}if(t==='invest'){form.elements.from.value='personal';form.elements.to.value='investment'}if(t==='uninvest'){form.elements.from.value='investment';form.elements.to.value='personal'}};form.elements.type.addEventListener('change',refresh);refresh();

function taskModal(area,id){let r=state.tasks.find(x=>x.id===id)||{area,kind:categoryConfigs[area].kinds[0],title:'',date:dnow(),notes:'',done:false};showModal(id?'تعديل عنصر':'إضافة إلى '+categoryConfigs[area].title,`<form id="taskForm" class="form-grid"><label class="full">العنوان<input name="title" value="${esc(r.title)}" maxlength="180" required></label><label>القسم<select name="area">${Object.entries(categoryConfigs).filter(([k])=>k!=='tasks').concat([['tasks',categoryConfigs.tasks]]).map(([k,v])=>`<option value="${k}" ${r.area===k?'selected':''}>${v.title}</option>`).join('')}</select></label><label>النوع<input name="kind" value="${esc(r.kind)}" maxlength="50" placeholder="مهمة / اختبار / موعد" required></label><label>التاريخ<input name="date" type="date" value="${r.date||dnow()}"></label><label class="full">تفاصيل إضافية<textarea name="notes">${esc(r.notes)}</textarea></label><div class="full form-actions"><button class="primary">حفظ</button></div></form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:id||uid(),title:String(f.get('title')),area:String(f.get('area')),kind:String(f.get('kind')),date:String(f.get('date')),notes:String(f.get('notes')),done:r.done};if(id)state.tasks=state.tasks.map(z=>z.id===id?x:z);else state.tasks.push(x);save();$('#modal').close();render();toast('تم حفظ العنصر')}}
function memoryModal(id){let r=state.memories.find(m=>m.id===id)||{title:'',date:dnow(),album:'',notes:'',fileIds:[]};showModal(id?'تعديل الذكرى':'إضافة ذكرى جديدة',`<form id="memoryForm" class="form-grid"><label class="full">عنوان الذكرى<input name="title" maxlength="160" value="${esc(r.title)}" required></label><label>التاريخ<input name="date" type="date" value="${r.date||dnow()}" required></label><label>الألبوم<input name="album" maxlength="80" value="${esc(r.album)}" placeholder="سفر، عائلة، جامعة..."></label><label class="full">وصف الذكرى<textarea name="notes">${esc(r.notes)}</textarea></label><label class="full">إضافة صور وفيديوهات (20 ملفًا كحد أقصى لكل مرة، 40MB لكل ملف)<input id="memoryFiles" type="file" accept="image/*,video/*" multiple></label><div class="full note">المرفقات السابقة محفوظة عند التعديل. للتخلص من ملف معين، احذف الذكرى كاملة ثم أنشئها مجددًا.</div><div class="full form-actions"><button class="primary" id="saveMemory">حفظ الذكرى</button></div></form>`);$('#memoryForm').onsubmit=async e=>{e.preventDefault();let btn=$('#saveMemory');btn.disabled=true;let f=new FormData(e.target),files=[...$('#memoryFiles').files],max=40*1024*1024;if(files.length>20||files.some(z=>z.size>max)||files.some(z=>!/^image\/|^video\//.test(z.type))){toast('الحد: 20 ملفًا، 40MB لكل ملف، صور أو فيديو فقط');btn.disabled=false;return}let stored=[];try{for(let file of files){let key=uid();await dbWrite('files',key,{blob:file,name:file.name,type:file.type});stored.push(key)}let m={id:id||uid(),title:String(f.get('title')),date:String(f.get('date')),album:String(f.get('album')||'بدون ألبوم'),notes:String(f.get('notes')||''),fileIds:[...(r.fileIds||[]),...stored]};if(id)state.memories=state.memories.map(z=>z.id===id?m:z);else state.memories.push(m);await save();$('#modal').close();render();toast('تم حفظ الذكرى محليًا')}catch(error){for(let x of stored)await dbDelete('files',x);toast('تعذر حفظ الملفات. قد تكون مساحة الجهاز غير كافية: '+error.message)}finally{btn.disabled=false let objectUrls=[];function clearUrls(){objectUrls.forEach(x=>URL.revokeObjectURL(x));objectUrls=[]}async function renderThumbnails(){clearUrls();for(let m of state.memories){let el=document.getElementById('thumb-'+m.id);if(!el||!m.fileIds?.length)continue;let file=await dbRead('files',m.fileIds[0]);if(!el.isConnected||!file)continue;let url=URL.createObjectURL(file.blob);objectUrls.push(url);if(file.type.startsWith('image/')){let im=document.createElement('img');im.src=url;im.className='cover';im.alt='صورة الذكرى';el.replaceWith(im)}else{el.textContent='🎥'}}}
async function preview(id){let m=state.memories.find(x=>x.id===id);if(!m)return;showModal(esc(m.title),`<div class="muted">${datefmt(m.date)} · ${esc(m.album)}</div><p>${esc(m.notes)}</p><div id="mediaPreview" class="list"></div>`);let target=$('#mediaPreview');for(let key of m.fileIds||[]){let x=await dbRead('files',key);if(!x)continue;let url=URL.createObjectURL(x.blob);objectUrls.push(url);let wrapper=document.createElement('div');wrapper.className='card';let media=x.type.startsWith('video/')?document.createElement('video'):document.createElement('img');media.src=url;media.style='width:100%;border-radius:12px;max-height:400px;object-fit:contain';if(media.tagName==='VIDEO')media.controls=true;wrapper.append(media);let a=document.createElement('a');a.href=url;a.download=x.name||'memory';a.textContent='⬇ حفظ الملف الأصلي';a.style='color:#8ac4ff';wrapper.append(a);target.append(wrapper)}}
async function deletion(kind,id){if(!confirm('هل تريد الحذف نهائيًا؟'))return;if(kind==='journal')state.journal=state.journal.filter(x=>x.id!==id);if(kind==='objectives')state.objectives=state.objectives.filter(x=>x.id!==id);if(kind==='records')state.records=state.records.filter(x=>x.id!==id);if(kind==='tasks')state.tasks=state.tasks.filter(x=>x.id!==id);if(kind==='courses'){state.courses=state.courses.filter(x=>x.id!==id);/* جلسات سابقة تحتفظ بالمرجع مع إشارة للمقرر المحذوف */}if(kind==='studySessions')state.studySessions=state.studySessions.filter(x=>x.id!==id);if(kind==='carLogs')state.carLogs=state.carLogs.filter(x=>x.id!==id);if(kind==='bills')state.bills=state.bills.filter(x=>x.id!==id);if(kind==='memories'){let m=state.memories.find(x=>x.id===id);state.memories=state.memories.filter(x=>x.id!==id);for(let key of m?.fileIds||[])await dbDelete('files',key)}await save();render();toast('تم الحذف')}
function bytesToBase64(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function base64ToBlob(data,type){let raw=atob(data),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return new Blob([arr],{type:type||'application/octet-stream'})}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function exportAll(){let btn=$('#export');btn.disabled=true;try{await saving;let keys=await dbAllFiles(),files={};for(let key of keys){let x=await dbRead('files',key);files[key]={name:x.name,type:x.type,base64:await bytesToBase64(x.blob)}}let out={format:'hayati-backup',version:1,createdAt:new Date().toISOString(),state,files};downloadBlob(new Blob([JSON.stringify(out)],{type:'application/json'}),'hayati-backup-'+dnow()+'.json');toast('تم تجهيز النسخة الاحتياطية. تأكد من حفظ الملف في مكان آمن.')}catch(e){toast('تعذر التصدير: '+e.message)}finally{btn.disabled=false}}
async function importAll(file){if(!file)return;if(!confirm('استيراد النسخة سيستبدل جميع البيانات والذكريات الحالية. هل تريد المتابعة؟'))return;try{let raw=JSON.parse(await file.text());if(raw.format!=='hayati-backup'||raw.version!==1||!raw.state||!Array.isArray(raw.state.records)||!Array.isArray(raw.state.tasks)||!Array.isArray(raw.state.memories)||!raw.files)throw Error('صيغة النسخة الاحتياطية غير صحيحة');let snapshot={state:structuredClone(state)};let previous=await dbAllFiles();snapshot.files={};for(let k of previous)snapshot.files[k]=await dbRead('files',k);try{for(let k of previous)await dbDelete('files',k);for(let [key,val]of Object.entries(raw.files)){if(!val?.base64)throw Error('مرفق غير صالح');await dbWrite('files',key,{blob:base64ToBlob(val.base64,val.type),name:val.name,type:val.type})}state=raw.state;await save()}catch(e){for(let k of await dbAllFiles())await dbDelete('files',k);for(let [key,val] of Object.entries(snapshot.files))await dbWrite('files',key,val);state=snapshot.state;await save();throw e}render();toast('تم استيراد النسخة')}catch(e){toast('فشل الاستيراد: '+e.message)}}

function journalModal(id){let x=state.journal.find(x=>x.id===id)||{date:dnow(),type:'يوميات',title:'',notes:'',mood:''};showModal(id?'تعديل الحدث':'حدث جديد في حياتي',`<form id="journalForm" class="form-grid"><label>تاريخ الحدث<input name="date" type="date" value="${x.date}" required></label><label>نوع الحدث<select name="type">${journalTypes.map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">عنوان الحدث<input name="title" maxlength="180" value="${esc(x.title)}" required></label><label>مزاجك<select name="mood">${['','ممتاز','جيد','عادي','متعب','متوتر'].map(v=>`<option ${x.mood===v?'selected':''}>${v||'غير محدد'}</option>`).join('')}</select></label><label class="full">التفاصيل<textarea name="notes">${esc(x.notes)}</textarea></label><div class="full"><button class="primary">حفظ في سجل حياتي</button></div></form>`);$('#journalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:id||uid(),date:String(f.get('date')),type:String(f.get('type')),title:String(f.get('title')).trim(),mood:String(f.get('mood')),notes:String(f.get('notes'))};if(!v.title)return;if(id)state.journal=state.journal.map(z=>z.id===id?v:z);else state.journal.push(v);save();$('#modal').close();render();toast('تم حفظ الحدث محليًا')}}
const areas=['مالي','دراسي','مهني','صحي','علاقات','مستقبل','شخصي'];
function objectivesPage(){let objectives=[...state.objectives].sort((a,b)=>(a.done-b.done)),completed=objectives.filter(x=>x.done).length;return `${head('🎯 أهداف حياتي','حول طموحاتك إلى خطوات عملية قابلة للقياس','<button class="primary" data-action="objective">+ هدف جديد</button>')}<div class="cards">${card('إجمالي الأهداف',objectives.length)}${card('المكتمل',completed)}${card('قيد العمل',objectives.length-completed)}</div><div class="note">اختر رقمًا مستهدفًا، ثم حدث تقدمك عند تحقيق خطوات فعلية. لا يتم اختراع نسب إنجاز أو أرباح تلقائيًا.</div><section class="section"><div class="list">${objectives.length?objectives.map(g=>{let pct=g.target>0?Math.max(0,Math.min(100,g.current/g.target*100)):0;return `<div class="card"><div class="section-head"><div><small class="muted">${esc(g.area)} · ${g.due?datefmt(g.due):'بدون موعد'}</small><h3>${esc(g.title)}</h3></div><span class="tag">${g.done?'مكتمل':Math.round(pct)+'%'}</span></div><div class="bar"><i style="width:${g.done?100:pct}%"></i></div><p class="muted">التقدم: ${fmt(g.current)} من ${fmt(g.target)} ${esc(g.unit||'وحدة')}</p>${g.notes?`<p>${esc(g.notes)}</p>`:''}<div class="row"><button class="secondary small" data-editobjective="${g.id}">تحديث التقدم</button><button class="secondary small" data-completeobjective="${g.id}">${g.done?'إعادة فتح':'إنهاء الهدف'}</button><button class="danger small" data-delete="objectives:${g.id}">حذف</button></div></div>`}).join(''):'<div class="empty">مثلًا: إنهاء مادة جامعية، الادخار للزواج، تعلم أساسيات الشبكات، أو الالتزام برياضة أسبوعية.</div>'}</div></section>`}
function objectiveModal(id){let x=state.objectives.find(x=>x.id===id)||{title:'',area:'شخصي',due:'',target:100,current:0,unit:'%',notes:'',done:false};showModal(id?'تحديث الهدف':'إضافة هدف لحياتي',`<form id="objectiveForm" class="form-grid"><label class="full">الهدف<input name="title" required maxlength="160" value="${esc(x.title)}" placeholder="مثال: ادخار 20 ألف ريال"></label><label>المجال<select name="area">${areas.map(v=>`<option ${x.area===v?'selected':''}>${v}</option>`).join('')}</select></label><label>تاريخ الاستحقاق<input type="date" name="due" value="${x.due||''}"></label><label>الرقم المستهدف<input name="target" type="number" min="0.01" step="any" required value="${x.target}"></label><label>التقدم الحالي<input name="current" type="number" min="0" step="any" required value="${x.current}"></label><label class="full">وحدة القياس<input name="unit" maxlength="30" value="${esc(x.unit)}" placeholder="ريال / درس / ساعة"></label><label class="full">خطوات أو ملاحظات<textarea name="notes">${esc(x.notes)}</textarea></label><div class="full"><button class="primary">حفظ الهدف</button></div></form>`);$('#objectiveForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:id||uid(),title:String(f.get('title')).trim(),area:String(f.get('area')),due:String(f.get('due')),target:Number(f.get('target')),current:Number(f.get('current')),unit:String(f.get('unit')),notes:String(f.get('notes')),done:x.done};if(!v.title||!Number.isFinite(v.target)||v.target<=0||!Number.isFinite(v.current)||v.current<0){toast('تحقق من القيم');return}if(id)state.objectives=state.objectives.map(z=>z.id===id?v:z);else state.objectives.push(v);save();$('#modal').close();render();toast('تم حفظ الهدف')}}

document.addEventListener('click',async e=>{let z=e.target.closest('[data-report-view]');if(z){financeReportView=z.dataset.reportView;render();return;}z=e.target.closest('[data-report-year]');if(z){financeReportYear+=Number(z.dataset.reportYear);render();return;}z=e.target.closest('[data-report-month]');if(z){financeViewMonth=z.dataset.reportMonth;financeReportView='details';render();return;}z=e.target.closest('[data-report-classify]');if(z){reportClassificationModal();return;}z=e.target.closest('[data-report-apply]');if(z){financeReportCustom={start:document.getElementById('reportStart').value,end:document.getElementById('reportEnd').value,category:document.getElementById('reportCategory').value};render();return;}if(e.target.closest('#financeReportCsv')){reportCsvExport();return;}});
document.addEventListener('click',async e=>{let b=e.target.closest('[data-fastkind]');if(b){fastExpense();if(b.dataset.fastkind!=='expense'){let type=$('#quickExpenseForm [data-qkind="'+b.dataset.fastkind+'"]');type?.click()}return}b=e.target.closest('[data-quickcat]');if(b){fastExpense(b.dataset.quickcat);return}b=e.target.closest('[data-financeday]');if(b){financeDay(b.dataset.financeday);return}b=e.target.closest('[data-financemonth]');if(b){financeViewMonth=financeMonthDelta(financeViewMonth||financialMonth(),Number(b.dataset.financemonth));render();return}b=e.target.closest('[data-financelimit]');if(b){limitModal();return}});
document.addEventListener('click',async e=>{let x=e.target.closest('[data-deletegrade]');if(x){let [cid,gid]=x.dataset.deletegrade.split(':');let c=state.courses.find(c=>c.id===cid);if(c&&confirm('حذف هذه الدرجة فقط؟')){c.grades=(c.grades||[]).filter(g=>g.id!==gid);await save();render()}return}x=e.target.closest('[data-editcourse]');if(x){courseModal(x.dataset.editcourse);return}x=e.target.closest('[data-grade]');if(x){gradeModal(x.dataset.grade);return}x=e.target.closest('[data-editsession]');if(x){sessionModal(x.dataset.editsession);return}x=e.target.closest('[data-editcarlog]');if(x){carLogModal(x.dataset.editcarlog);return}x=e.target.closest('[data-editbill]');if(x){billModal(x.dataset.editbill);return}x=e.target.closest('[data-togglebill]');if(x){let b=state.bills.find(z=>z.id===x.dataset.togglebill);if(b){b.paid=!b.paid;await save();render()}return}
let a=e.target.closest('[data-go]');if(a){go(a.dataset.go);return}a=e.target.closest('[data-editjournal]');if(a){journalModal(a.dataset.editjournal);return}a=e.target.closest('[data-editobjective]');if(a){objectiveModal(a.dataset.editobjective);return}a=e.target.closest('[data-completeobjective]');if(a){let g=state.objectives.find(x=>x.id===a.dataset.completeobjective);if(g){g.done=!g.done;await save();render()}return}a=e.target.closest('[data-filter]');if(a){filter=a.dataset.filter;render();return}a=e.target.closest('[data-action]');if(a){a.dataset.action==='record'?recordModal():a.dataset.action==='category'?categoryModal():a.dataset.action==='categorybudget'?limitModal():a.dataset.action==='account'?accountModal():a.dataset.action==='bill'?billModal():a.dataset.action==='course'?courseModal():a.dataset.action==='session'?sessionModal():a.dataset.action==='carprofile'?carProfileModal():a.dataset.action==='carlog'?carLogModal():a.dataset.action==='memory'?memoryModal():a.dataset.action==='journal'?journalModal():objectiveModal();return}a=e.target.closest('[data-addtask]');if(a){taskModal(a.dataset.addtask);return}a=e.target.closest('[data-editrecord]');if(a){recordModal(a.dataset.editrecord);return}a=e.target.closest('[data-edittask]');if(a){let item=state.tasks.find(x=>x.id===a.dataset.edittask);taskModal(item.area,a.dataset.edittask);return}a=e.target.closest('[data-editmemory]');if(a){memoryModal(a.dataset.editmemory);return}a=e.target.closest('[data-delete]');if(a){let[k,id]=a.dataset.delete.split(':');await deletion(k,id);return}a=e.target.closest('[data-preview]');if(a){await preview(a.dataset.preview);return}if(e.target.id==='financeCsv'){financeCsv();return}if(e.target.id==='export'){await exportAll()}});
document.addEventListener('change',e=>{if(e.target.dataset.toggle){let x=state.tasks.find(t=>t.id===e.target.dataset.toggle);if(x){x.done=e.target.checked;save();render()}}if(e.target.id==='importFile'){importAll(e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();let f=new FormData(e.target);for(let [k,v]of f)state.settings[k]=Number(v)||0;save();render();toast('تم حفظ الإعدادات')}});
(async()=>{try{db=await openDB();let saved=await dbRead('data','state');if(saved){state={...state,...saved,journal:Array.isArray(saved.journal)?saved.journal:[],objectives:Array.isArray(saved.objectives)?saved.objectives:[],settings:{...state.settings,...saved.settings},accounts:Array.isArray(saved.accounts)?saved.accounts:[],courses:Array.isArray(saved.courses)?saved.courses:[],studySessions:Array.isArray(saved.studySessions)?saved.studySessions:[],carLogs:Array.isArray(saved.carLogs)?saved.carLogs:[],bills:Array.isArray(saved.bills)?saved.bills:[],financeCategories:Array.isArray(saved.financeCategories)?saved.financeCategories:[],categoryLimits:saved.categoryLimits&&typeof saved.categoryLimits==='object'?saved.categoryLimits:{},carProfile:{...state.carProfile,...(saved.carProfile||{})}}}render();}catch(e){$('#app').innerHTML=`<div class="empty">تعذر فتح التخزين المحلي في هذا المتصفح. افتح الموقع من متصفح يدعم IndexedDB مع السماح بتخزين بيانات المواقع.<p>${esc(e.message)}</p></div>`}})();
</script></body></html>
